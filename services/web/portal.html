<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z-MAX 产品服务 · 全服务总索引</title>
<style>
:root{--bg:#0b0e13;--card:#131922;--line:#212a36;--fg:#e8eef7;--dim:#8b97a8;
--ok:#39d98a;--bad:#f4626b;--warn:#e3b341;--acc:#4c9aff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:14px/1.55 -apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}
header{padding:18px 22px 14px;border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.4px}
.tagline{color:var(--dim);font-size:12.5px}
.sum{color:var(--dim);font-size:13px;margin-left:auto}
.sum b{color:var(--ok)} .sum i{color:var(--bad);font-style:normal}
#q{background:#0e131a;border:1px solid var(--line);color:var(--fg);border-radius:7px;
padding:7px 11px;font-size:13px;width:240px;outline:none}
#q:focus{border-color:var(--acc)}
main{padding:16px 22px 40px;max-width:1360px}
.layer{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.layer h2{margin:0;font-size:14px;color:var(--acc);font-weight:600}
.layer span{font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.thumb{display:block;position:relative;aspect-ratio:16/10;background:#0a0d12;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
font-size:34px;font-weight:700;color:#2f3d4f;background:
linear-gradient(135deg,#121a24,#0c1118)}
.thumb .age{position:absolute;right:7px;bottom:6px;font-size:10.5px;color:#c8d3e0;
background:rgba(6,9,13,.72);padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.row{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--bad)}
.dot.up{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.slow{background:var(--warn)}
.dot.na{background:#4a5668}
.nm{font-size:13.5px;font-weight:600}
.po{margin-left:auto;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.ds{color:var(--dim);font-size:12px;line-height:1.45}
.acts{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:4px}
.btn{background:#18202b;border:1px solid var(--line);color:#cfe0f5;border-radius:6px;
padding:4px 10px;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.pri{background:#1c3a63;border-color:#2b5f9e;color:#dcecff}
.cap{font-size:10.5px;color:#5f6c7e;margin-left:auto;text-align:right}
.err{font-size:11px;color:var(--bad)}
footer{padding:14px 22px 34px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
footer code{background:var(--card);padding:2px 5px;border-radius:3px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
background:#1c3a63;color:#dcecff;padding:8px 16px;border-radius:8px;font-size:13px;
opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<header>
  <h1>Z-MAX 产品服务</h1>
  <div class="tagline">全服务总索引 · 点卡片直达 · 复制链接给远端/别的机器</div>
  <input id="q" placeholder="搜索 名称 / 端口 / 层">
  <div class="sum" id="sum">探测中…</div>
</header>
<main id="main"></main>
<footer>
契约 <code>services/registry.json</code> · 清单 <code>curl :8788/api/services</code> ·
聚合健康 <code>curl :8788/api/health</code> · 缩略图 <code>/thumb/&lt;name&gt;.png</code>
（重截: <code>python3 tools/gen_service_thumbs.py</code>）
</footer>
<div id="toast"></div>
<script>
const ORDER=['L5','L4','L3','L2','OPS','CLIENT'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');
  clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('on'),1400)}
function copy(txt){navigator.clipboard.writeText(txt).then(()=>toast('已复制: '+txt),
  ()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);
       a.select();document.execCommand('copy');a.remove();toast('已复制: '+txt)})}
let DATA=null,Q='';
function urlOf(s){return s.kind==='client'?(s.open_hint||''):(location.origin+'/go/'+s.name+(s.path||'/'))}
function render(){
  if(!DATA) return;
  const all=DATA.services.filter(s=>{
    if(!Q) return true;
    const t=(s.name+' '+s.title+' '+s.layer+' '+s.port+' '+(s.desc||'')).toLowerCase();
    return t.indexOf(Q)>=0});
  const tot=DATA.services.filter(s=>s.kind!=='client').length;
  document.getElementById('sum').innerHTML=
    '<b>'+DATA.n_up+'</b> 在线 / '+(tot-DATA.n_up)+' 离线 · 共 '+tot+' 个服务 · 探测 '+esc((DATA.checked_at||'').slice(11));
  const byL={};all.forEach(s=>{(byL[s.layer]=byL[s.layer]||[]).push(s)});
  let h='';
  ORDER.forEach(L=>{
    const arr=byL[L]; if(!arr||!arr.length) return;
    const meta=(DATA.layers||{})[L]||{};
    h+='<div class="layer"><h2>'+esc(L)+' '+esc(meta.title||'')+'</h2><span>'+esc(meta.desc||'')+'</span></div>';
    h+='<div class="grid">';
    arr.forEach(s=>{
      const cls=s.kind==='client'?'na':(s.up?(s.ms>1200?'slow':'up'):'');
      const nm=esc(s.title||s.name);
      const ph=nm.slice(0,1);
      const age=s.thumb_age_s!=null?('缩略图 '+Math.round(s.thumb_age_s/60)+' 分钟前'):'';
      const openBtn=s.kind==='client'
        ? '<span class="btn">'+esc(s.open_hint||'本机')+'</span>'
        : '<a class="btn pri" href="'+urlOf(s)+'" target="_blank" rel="noopener">打开</a>';
      const cp=s.kind==='client'?''
        : '<button class="btn" data-copy="'+esc(urlOf(s))+'">复制链接</button>';
      h+='<article class="card" data-k="'+esc((s.name+' '+s.title+' '+s.layer+' '+s.port).toLowerCase())+'">'
        +'<a class="thumb" href="'+(s.kind==='client'?'javascript:void(0)':urlOf(s))+'" target="_blank" rel="noopener">'
        +(s.has_thumb?'<img src="/thumb/'+esc(s.name)+'.png?t='+(s.thumb_mtime||0)+'" alt="'+nm+'" '
            +'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">':'')
        +'<div class="ph"'+(s.has_thumb?'':' style="display:flex"')+'>'+esc(ph)+'</div>'
        +(age?'<span class="age">'+esc(age)+'</span>':'')+'</a>'
        +'<div class="body">'
        +'<div class="row"><span class="dot '+cls+'"></span><span class="nm">'+nm+'</span>'
        +'<span class="po">'+(s.port?(':'+s.port):'本机')+(s.ms!=null?' · '+s.ms+'ms':'')+'</span></div>'
        +'<div class="ds">'+esc(s.desc||'')+'</div>'
        +(s.up?'':'<div class="err">'+esc(s.tunnel?('隧道未起 · '+s.tunnel):(s.err||'离线'))+'</div>')
        +'<div class="acts">'+openBtn+cp
        +(s.capabilities&&s.capabilities.length?'<span class="cap">'+esc(s.capabilities.slice(0,2).join(' · '))+'</span>':'')
        +'</div></div></article>';
    });
    h+='</div>';
  });
  if(!h) h='<p style="color:#8b97a8">没有匹配的服务</p>';
  document.getElementById('main').innerHTML=h;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]');
  if(b){e.preventDefault();copy(b.getAttribute('data-copy'))}
});
document.getElementById('q').addEventListener('input',e=>{Q=e.target.value.trim().toLowerCase();render()});
function pull(){
  fetch('/api/services?force=1').then(r=>r.json()).then(d=>{DATA=d;render()})
  .catch(e=>{document.getElementById('sum').textContent='网关异常: '+e});
}
pull(); setInterval(pull,8000);
</script></body></html>
