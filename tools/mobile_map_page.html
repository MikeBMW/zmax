<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0c10">
<title>手机建图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0c10;color:#dfe3ea;font:14px/1.6 -apple-system,"Helvetica Neue","Noto Sans CJK SC",sans-serif;
     height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid #1b2028;display:flex;align-items:center;gap:10px;flex-shrink:0}
h1{font-size:15px;font-weight:600}
.tag{padding:2px 8px;border-radius:9px;font-size:11px;background:#16202c;color:#63b3ed}
.warn{background:#2d1b1e;color:#f87171}
main{flex:1;position:relative;overflow:hidden}
#view{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;padding:24px;text-align:center}
#hint p{color:#6b7683;font-size:13px;line-height:1.8;max-width:300px}
.big{background:#1d4ed8;color:#fff;border:none;border-radius:12px;padding:16px 30px;
     font-size:16px;font-weight:600;width:100%;max-width:300px;cursor:pointer}
.big:active{background:#1e40af}
.big:disabled{background:#2a3140;color:#5a6270}
#file{display:none}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;background:#0d1117ee;
     border-top:1px solid #1b2028;font-size:12px;display:flex;justify-content:space-between;
     gap:12px;backdrop-filter:blur(8px)}
#bar span{color:#6b7683}#bar b{color:#dfe3ea;font-variant-numeric:tabular-nums}
#prog{position:absolute;top:0;left:0;height:2px;background:#3b82f6;width:0;transition:width .3s;z-index:5}
</style></head><body>
<header>
  <h1>手机拍视频建图</h1>
  <span class="tag" id="st">待上传</span>
</header>
<div id="prog"></div>
<main>
  <canvas id="view"></canvas>
  <div id="hint">
    <p>拍一段边走边拍的视频（3 秒以上，画面里要有近处和远处的物体，慢一点横向移动）</p>
    <button class="big" id="pick">选择 / 拍摄视频</button>
    <input type="file" id="file" accept="video/*" capture="environment">
  </div>
  <div id="bar" style="display:none">
    <span>帧 <b id="nf">—</b></span>
    <span>点 <b id="np">—</b></span>
    <span>耗时 <b id="sec">—</b></span>
  </div>
</main>
<script>
'use strict';
// 原生 WebGL 点云渲染 (不依赖 Three.js: 它 1.27MB, 走公网要 6 秒; 这里整个页面 ~9KB)
const cv = document.getElementById('view');
const st = document.getElementById('st');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const prog = document.getElementById('prog');
const fileIn = document.getElementById('file');

let gl, progObj, gPos, gCol, gTraj, nPts = 0, nTraj = 0;
let rotX = 0.4, rotY = 0.6, dist = 2.6, dragging = false, last = null, pinch0 = null;

function setTag(t, warn) { st.textContent = t; st.className = 'tag' + (warn ? ' warn' : ''); }
function setProg(p) { prog.style.width = Math.max(0, Math.min(100, p)) + '%'; }

const VS = 'attribute vec3 aPos; attribute vec3 aCol;' +
           'uniform mat4 uMVP; uniform float uSize; varying vec3 vCol;' +
           'void main(){ vCol = aCol; gl_Position = uMVP * vec4(aPos,1.0); gl_PointSize = uSize; }';
const FS = 'precision mediump float; varying vec3 vCol;' +
           'void main(){ gl_FragColor = vec4(vCol, 1.0); }';

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function mat4mul(a, b) {
  const o = new Float32Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    o[i*4+j] = a[j]*b[i*4] + a[4+j]*b[i*4+1] + a[8+j]*b[i*4+2] + a[12+j]*b[i*4+3];
  }
  return o;
}
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy/2), nf = 1/(near-far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function lookAt(eye, tgt, up) {
  let zx=eye[0]-tgt[0], zy=eye[1]-tgt[1], zz=eye[2]-tgt[2];
  let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
    -(xx*eye[0]+xy*eye[1]+xz*eye[2]), -(yx*eye[0]+yy*eye[1]+yz*eye[2]),
    -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1]);
}

function initGL() {
  if (gl) return;
  gl = cv.getContext('webgl', {antialias: true, preserveDrawingBuffer: true});
  if (!gl) throw new Error('此浏览器不支持 WebGL');
  progObj = gl.createProgram();
  gl.attachShader(progObj, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(progObj, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(progObj);
  if (!gl.getProgramParameter(progObj, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(progObj));
  gl.useProgram(progObj);
  gl.clearColor(0.04, 0.05, 0.06, 1);
  gl.enable(gl.DEPTH_TEST);
  gPos = gl.createBuffer(); gCol = gl.createBuffer(); gTraj = gl.createBuffer();
  resize(); addEventListener('resize', resize);
  requestAnimationFrame(loop);
}

function resize() {
  if (!gl) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = (cv.clientWidth || innerWidth) * dpr;
  cv.height = (cv.clientHeight || innerHeight) * dpr;
  gl.viewport(0, 0, cv.width, cv.height);
}

function loop() {
  requestAnimationFrame(loop);
  if (!gl) return;
  if (!dragging && !pinch0) rotY += 0.0015;
  const eye = [dist*Math.cos(rotX)*Math.sin(rotY), dist*Math.sin(rotX), dist*Math.cos(rotX)*Math.cos(rotY)];
  const mvp = mat4mul(perspective(0.96, cv.width/cv.height, 0.01, 1000), lookAt(eye, [0,0,0], [0,1,0]));
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const uMVP = gl.getUniformLocation(progObj, 'uMVP');
  const uSize = gl.getUniformLocation(progObj, 'uSize');
  const aPos = gl.getAttribLocation(progObj, 'aPos');
  const aCol = gl.getAttribLocation(progObj, 'aCol');
  gl.uniformMatrix4fv(uMVP, false, mvp);
  gl.enableVertexAttribArray(aPos);
  gl.enableVertexAttribArray(aCol);
  if (nPts) {
    gl.bindBuffer(gl.ARRAY_BUFFER, gPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, gCol); gl.vertexAttribPointer(aCol, 3, gl.FLOAT, false, 0, 0);
    gl.uniform1f(uSize, 3.0 * (devicePixelRatio || 1));
    gl.drawArrays(gl.POINTS, 0, nPts);
  }
  if (nTraj) {
    gl.bindBuffer(gl.ARRAY_BUFFER, gTraj); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.disableVertexAttribArray(aCol);
    gl.vertexAttrib3f(aCol, 1.0, 0.65, 0.1);
    gl.uniform1f(uSize, 2.0);
    gl.drawArrays(gl.LINE_STRIP, 0, nTraj);
    gl.enableVertexAttribArray(aCol);
  }
}

function down(x, y) { dragging = true; last = [x, y]; }
function move(x, y) {
  if (!dragging || !last) return;
  rotY -= (x - last[0]) * 0.008;
  rotX += (y - last[1]) * 0.008;
  rotX = Math.max(-1.5, Math.min(1.5, rotX));
  last = [x, y];
}
function up() { dragging = false; last = null; pinch0 = null; }
cv.addEventListener('mousedown', e => down(e.clientX, e.clientY));
addEventListener('mousemove', e => move(e.clientX, e.clientY));
addEventListener('mouseup', up);
cv.addEventListener('touchstart', e => { const t = e.touches[0]; down(t.clientX, t.clientY); }, {passive: true});
cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (pinch0) { dist *= pinch0 / d; dist = Math.max(0.3, Math.min(30, dist)); }
    pinch0 = d; return;
  }
  const t = e.touches[0]; if (t) move(t.clientX, t.clientY);
}, {passive: true});
cv.addEventListener('touchend', up);
cv.addEventListener('wheel', e => {
  dist *= (1 + Math.sign(e.deltaY) * 0.12);
  dist = Math.max(0.3, Math.min(30, dist));
  e.preventDefault();
}, {passive: false});

document.getElementById('pick').onclick = () => fileIn.click();

fileIn.onchange = async () => {
  const f = fileIn.files[0];
  if (!f) return;
  document.getElementById('pick').disabled = true;
  setTag('上传中…'); setProg(10);
  const fd = new FormData();
  fd.append('video', f, f.name || 'video.mp4');
  try {
    const r = await fetch('upload', {method: 'POST', body: fd});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '上传失败');
    setProg(30); setTag('建图中…');
    poll(j.id);
  } catch (e) {
    setTag('失败: ' + e.message, true);
    document.getElementById('pick').disabled = false;
    setProg(0);
  }
};

async function poll(id) {
  const t0 = Date.now();
  const tick = async () => {
    try {
      const j = await (await fetch('job?id=' + id, {cache: 'no-store'})).json();
      setTag(j.msg || j.state);
      if (j.frames) document.getElementById('nf').textContent = j.frames;
      if (j.state === 'done') {
        setProg(100); setTag('完成');
        document.getElementById('np').textContent = j.n_points;
        document.getElementById('sec').textContent = j.secs + 's';
        bar.style.display = 'flex';
        showMap(id);
        return;
      }
      if (j.state === 'failed') {
        setTag('失败: ' + (j.err || ''), true);
        document.getElementById('pick').disabled = false;
        setProg(0);
        return;
      }
      setProg(30 + Math.min(65, (Date.now() - t0) / 400));
      setTimeout(tick, 1500);
    } catch (e) { setTimeout(tick, 2500); }
  };
  tick();
}

async function showMap(id) {
  hint.style.display = 'none';
  initGL();
  const pts = await (await fetch('points?id=' + id, {cache: 'no-store'})).json();
  if (!pts.length) { setTag('点云为空', true); return; }
  let cx=0, cy=0, cz=0;
  for (const p of pts) { cx += p[0]; cy += p[1]; cz += p[2]; }
  cx /= pts.length; cy /= pts.length; cz /= pts.length;
  let rad = 0;
  for (const p of pts) rad = Math.max(rad, Math.hypot(p[0]-cx, p[1]-cy, p[2]-cz));
  const s = rad > 1e-9 ? 1 / rad : 1;
  const pos = new Float32Array(pts.length * 3);
  const col = new Float32Array(pts.length * 3);
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    pos[i*3] = (p[0]-cx)*s; pos[i*3+1] = (p[1]-cy)*s; pos[i*3+2] = (p[2]-cz)*s;
    col[i*3] = (p[3] ?? 200)/255; col[i*3+1] = (p[4] ?? 200)/255; col[i*3+2] = (p[5] ?? 255)/255;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, gPos); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, gCol); gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
  nPts = pts.length;
  dist = 2.6;
  window.__zmap = {n: nPts, gl: gl, get traj() { return nTraj; }};
  try {
    const tj = await (await fetch('trajectory?id=' + id, {cache: 'no-store'})).json();
    if (tj.length > 1) {
      const tp = new Float32Array(tj.length * 3);
      for (let i = 0; i < tj.length; i++) {
        tp[i*3] = (tj[i][0]-cx)*s; tp[i*3+1] = (tj[i][1]-cy)*s; tp[i*3+2] = (tj[i][2]-cz)*s;
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, gTraj); gl.bufferData(gl.ARRAY_BUFFER, tp, gl.STATIC_DRAW);
      nTraj = tj.length;
    }
  } catch (e) {}
}

const qs = new URLSearchParams(location.search);
if (qs.get('id')) { hint.style.display = 'none'; initGL(); poll(qs.get('id')); }
</script>
</body></html>
