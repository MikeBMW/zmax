<body>
<div id="hd">
  <h1>光纤端面检测及清理自动化设备 · 工艺卡</h1>
  <span class="meta">技术协议 rev1.0 §2.2 九步工艺 · 坐标系同 /ar（X 右 / Y 近 / Z 上 · 单位 m · 地面 z=0）· 本体 3000×1500×1900 mm · 2 人</span>

    <button id="bDoc">⬇ 导出 Word（全 10 卡）</button>

<div id="wrap"></div>
<div id="tip">每张卡是一个独立三维窗口（拖拽旋转 / 滚轮缩放）：动画演示该步动作，下方为动作分解 · 技术细节 · 接口口径。数字均取自技术协议 rev1.0，未定项标「设计评审确认」。右上「⬇ 导出 Word（全 10 卡）」一键导出全部工艺卡（含三维截图）；每张卡右上角的小「⬇ Word」只导出该卡。</div>

<script>
"use strict";
/* =====================================================================
   /autoLight · 工艺卡版（一页 10 卡，每卡一个独立 3D 窗口）
   坐标：X 右 / Y 近 / Z 上，单位 m，地面 z=0 —— 与 /ar 同一 base 世界系
   几何按协议 1.3.3 / 2.1 的模块关系 1:1 布置（示意，非施工图）
   ===================================================================== */
const FL=3.0, FW=1.5, FH=1.9;       // 3000 x 1500 x 1900 mm
const TX=-FL/2, TY=-FW/2;
const TZ=0.86;                       // 工作台面
const LZ=0.875;                      // 流线面
const C={frame:'#2b3644',table:'#33404f',station:'#37485c',inst:'#2f4a63',tray:'#44586d'};

// 五个工站（沿 X 排布）
const ST=[
 {x:-0.80,w:0.26,short:'① FC 拔帽·端检'},
 {x:-0.42,w:0.24,short:'② MPO 拔帽·端检·回损'},
 {x:-0.05,w:0.26,short:'③ FC 回损 ×16'},
 {x: 0.34,w:0.28,short:'④ FC 端面·清洗·盖帽'},
 {x: 0.72,w:0.24,short:'⑤ MPO 端面·盖帽'}
];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const ph=(t,off,dur)=>clamp(((t+off)%dur)/dur,0,1);
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);
  return 'rgb('+Math.min(255,((n>>16)&255)*k|0)+','+Math.min(255,((n>>8)&255)*k|0)+','+Math.min(255,(n&255)*k|0)+')';
}

/* ---------------- 一个独立三维窗口 ---------------- */
class View{
  constructor(cv,opt){
    opt=opt||{};
    this.cv=cv; this.g=cv.getContext('2d');
    this.yaw=opt.yaw==null?-0.98:opt.yaw;
    this.pitch=opt.pitch==null?0.40:opt.pitch;
    this.dist=opt.dist||1.6;
    this.tgt=opt.tgt||[0,0,0.98];
    this.labels=true; this.spin=0.10; this.playing=true;
    this.LQ=[]; this.TQ=[]; this.W=0; this.H=0; this.DPR=1; this.drawn=0;
    this._bind();
  }
  _bind(){
    const cv=this.cv; let drag=null;
    cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};this.spin=0;
      cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';
      document.getElementById('bSpin').classList.remove('on');});
    cv.addEventListener('pointermove',e=>{
      if(!drag)return;
      this.yaw-=(e.clientX-drag.x)*0.010;
      this.pitch=clamp(this.pitch+(e.clientY-drag.y)*0.007,-0.10,1.25);
      drag={x:e.clientX,y:e.clientY};
    });
    const up=()=>{drag=null;cv.style.cursor='grab';};
    cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
    cv.addEventListener('wheel',e=>{e.preventDefault();
      this.dist=clamp(this.dist*(1+Math.sign(e.deltaY)*0.10),0.30,14);},{passive:false});
  }
  fit(box){
    // box: [[x0,y0,z0],[x1,y1,z1]] = 该卡主体的世界包围盒; 二分距离让 8 个角点都进视口
    if(!box) return;
    const pts=[];
    for(const x of [box[0][0],box[1][0]]) for(const y of [box[0][1],box[1][1]]) for(const z of [box[0][2],box[1][2]]) pts.push([x,y,z]);
    const mL=8, mR=8, mT=8, mB=16;
    const ok=(d)=>{
      this.dist=d; this.cam();
      for(const p of pts){ const q=this.pr(p);
        if(!q||q.u<mL||q.u>this.W-mR||q.v<mT||q.v>this.H-mB) return false; }
      return true;
    };
    let lo=0.25; if(ok(lo)){ return; }
    let hi=20;
    for(let i=0;i<26;i++){ const mid=(lo+hi)/2; if(ok(mid)) hi=mid; else lo=mid; }
    this.dist=hi*1.015; this.cam();
  }
  resize(){
    this.DPR=Math.min(2,window.devicePixelRatio||1);
    this.W=this.cv.clientWidth||560; this.H=this.cv.clientHeight||268;
    const w=Math.round(this.W*this.DPR), h=Math.round(this.H*this.DPR);
    if(this.cv.width!==w||this.cv.height!==h){ this.cv.width=w; this.cv.height=h; }
    this.g.setTransform(this.DPR,0,0,this.DPR,0,0);
  }
  cam(){
    const cy=Math.cos(this.yaw), sy=Math.sin(this.yaw);
    const cp=Math.cos(this.pitch), sp=Math.sin(this.pitch);
    const fwd=[cp*cy,cp*sy,-sp];
    const eye=[this.tgt[0]-fwd[0]*this.dist,this.tgt[1]-fwd[1]*this.dist,this.tgt[2]-fwd[2]*this.dist];
    const up=[0,0,1];
    let R=[fwd[1]*up[2]-fwd[2]*up[1], fwd[2]*up[0]-fwd[0]*up[2], fwd[0]*up[1]-fwd[1]*up[0]];
    const nl=Math.hypot(R[0],R[1],R[2])||1; R=[R[0]/nl,R[1]/nl,R[2]/nl];
    const U=[R[1]*fwd[2]-R[2]*fwd[1], R[2]*fwd[0]-R[0]*fwd[2], R[0]*fwd[1]-R[1]*fwd[0]];
    this._c={eye,fwd,R,U,F:Math.min(this.W,this.H)*1.30,CX:this.W/2,CY:this.H/2+6};
  }
  pr(P){
    const c=this._c; if(!c) return null;
    const dx=P[0]-c.eye[0], dy=P[1]-c.eye[1], dz=P[2]-c.eye[2];
    const z=dx*c.fwd[0]+dy*c.fwd[1]+dz*c.fwd[2];
    if(z<0.05) return null;
    return {u:c.CX+c.F*(dx*c.R[0]+dy*c.R[1]+dz*c.R[2])/z,
            v:c.CY-c.F*(dx*c.U[0]+dy*c.U[1]+dz*c.U[2])/z, z};
  }
  dep(P){const e=this._c.eye;return Math.hypot(P[0]-e[0],P[1]-e[1],P[2]-e[2]);}
  push(d,fn){this.LQ.push({d,fn});}
  quad(a,b,c2,d,fill){
    const A=this.pr(a),B=this.pr(b),Cc=this.pr(c2),D=this.pr(d);
    if(!A||!B||!Cc||!D)return;
    const dep=(this.dep(a)+this.dep(b)+this.dep(c2)+this.dep(d))/4;
    this.push(dep,()=>{const g=this.g;g.beginPath();g.moveTo(A.u,A.v);g.lineTo(B.u,B.v);
      g.lineTo(Cc.u,Cc.v);g.lineTo(D.u,D.v);g.closePath();
      if(fill){g.fillStyle=fill;g.fill();}});
  }
  box(x0,y0,z0,x1,y1,z1,color,o){
    o=o||{}; const k=o.k||1;
    if(o.noTop!==true) this.quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],shade(color,1.00*k));
    this.quad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],shade(color,0.78*k));
    this.quad([x1,y1,z0],[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],shade(color,0.66*k));
    this.quad([x0,y1,z0],[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],shade(color,0.72*k));
    this.quad([x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],shade(color,0.88*k));
  }
  line(a,b,color,lw,dash){
    const A=this.pr(a),B=this.pr(b); if(!A||!B)return;
    this.push((this.dep(a)+this.dep(b))/2,()=>{const g=this.g;g.strokeStyle=color;
      g.lineWidth=lw||1.3; if(dash)g.setLineDash(dash);
      g.beginPath();g.moveTo(A.u,A.v);g.lineTo(B.u,B.v);g.stroke(); if(dash)g.setLineDash([]);});
  }
  tube(a,b,color,r){
    const A=this.pr(a),B=this.pr(b); if(!A||!B)return;
    const sc=Math.max(2.0,r*(this._c.F/((A.z+B.z)/2)));
    this.push((this.dep(a)+this.dep(b))/2,()=>{const g=this.g;g.strokeStyle=color;
      g.lineWidth=sc;g.lineCap='round';g.beginPath();g.moveTo(A.u,A.v);g.lineTo(B.u,B.v);g.stroke();g.lineCap='butt';});
  }
  dot(P,color,r){
    const A=this.pr(P); if(!A)return;
    const sc=Math.max(1.4,r*(this._c.F/A.z));
    this.push(this.dep(P),()=>{const g=this.g;g.fillStyle=color;g.beginPath();g.arc(A.u,A.v,sc,0,7);g.fill();});
  }
  text(P,s,color,o){
    o=o||{}; const A=this.pr(P); if(!A)return;
    this.TQ.push({z:A.z,u:A.u+(o.dx||0),v:A.v+(o.dy||0),s,color,
      size:o.size||11,bold:!!o.bold,prio:o.prio==null?2:o.prio});
  }
  cores(center,axis,n,cols,color){
    for(let i=0;i<n;i++){
      const c=i%cols, r=Math.floor(i/cols);
      const p=[center[0]+(axis==='x'?(c-(cols-1)/2)*0.012:(r-(cols-1)/2)*0.012),
               center[1]+(axis==='x'?(r-(cols-1)/2)*0.012:(c-(cols-1)/2)*0.012),
               center[2]];
      this.dot(p,color,0.0035);
    }
  }
  paint(){
    const g=this.g;
    g.fillStyle='#080d12'; g.fillRect(0,0,this.W,this.H);
    this.LQ.sort((a,b)=>b.d-a.d);
    for(const it of this.LQ) it.fn();
    const kf=clamp(this.W/760,0.80,1.10);
    g.textBaseline='middle';
    this.TQ.sort((a,b)=>(a.prio-b.prio)||(b.z-a.z));
    const placed=[];
    for(const t of this.TQ){
      if(!this.labels) break;
      const sz=t.size*kf;
      g.font=(t.bold?'600 ':'')+sz.toFixed(1)+'px "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif';
      const w=g.measureText(t.s).width, bx=t.u-4, by=t.v-sz*0.72, bw=w+8, bh=sz*1.44;
      if(placed.some(p=>bx<p.x+p.w&&p.x<bx+bw&&by<p.y+p.h&&p.y<by+bh)) continue;
      placed.push({x:bx,y:by,w:bw,h:bh});
      g.fillStyle='rgba(6,10,14,.76)'; g.fillRect(bx,by,bw,bh);
      g.fillStyle=t.color; g.fillText(t.s,t.u,t.v);
    }
    this.drawn=placed.length;
  }
}

/* ---------------- 共用场景元素 ---------------- */
function grid(v,r){
  r=r||1.0;
  const n=Math.round(r/0.2);
  for(let i=-n;i<=n;i++){
    const heavy=(i%5===0);
    v.line([i*0.2,-r,0],[i*0.2,r,0],heavy?'#1c2836':'#131c25',heavy?1.1:0.7);
    v.line([-r,i*0.2,0],[r,i*0.2,0],heavy?'#1c2836':'#131c25',heavy?1.1:0.7);
  }
}
function axes(v,o){
  o=o||{}; const L=o.len||0.26;
  v.line([0,0,0],[L,0,0],'#ff5a68',1.6); v.text([L,0,0],'X','#ff5a68',{size:9.5,prio:7});
  v.line([0,0,0],[0,L,0],'#3ce07a',1.6); v.text([0,L,0],'Y','#3ce07a',{size:9.5,prio:7});
  v.line([0,0,0],[0,0,L],'#4aa8ff',1.6); v.text([0,0,L],'Z','#4aa8ff',{size:9.5,prio:7});
}
function frameCtx(v){
  const p=0.05;
  for(const x of [TX+p/2,FL/2-p/2]) for(const y of [TY+p/2,FW/2-p/2])
    v.box(x-p/2,y-p/2,0,x+p/2,y+p/2,FH,'#1b242e',{noTop:true});
  v.box(TX+0.04,TY+0.04,TZ-0.03,FL/2-0.04,FW/2-0.04,TZ,'#222d3a');
  v.box(TX,TY,FH-0.05,FL/2,TY+p,FH,'#1a232c');
  v.box(TX,FW/2-p,FH-0.05,FL/2,FW/2,FH,'#1a232c');
}
// 载具 + 光纤（本设备的主角：1 PCS MPO 端 + 16 FC 端）
function trayAsset(v,x,y,z,o){
  o=o||{};
  v.box(x-0.15,y-0.10,z-0.014,x+0.15,y+0.10,z,'#3b4c60');
  for(const d of [[-0.13,-0.08],[0.13,-0.08],[-0.13,0.08],[0.13,0.08]])
    v.dot([x+d[0],y+d[1],z+0.004],'#5a6f88',0.007);
  const mx=x-0.10;
  v.box(mx-0.030,y-0.020,z,mx+0.030,y+0.020,z+0.024,'#26404f');
  v.box(mx-0.030,y-0.020,z+0.024,mx+0.030,y+0.020,z+0.028,'#8fe8ff');
  for(let i=0;i<16;i++){
    const row=Math.floor(i/8), col=i%8;
    v.line([mx+0.030+col*0.004,y-0.012+row*0.024,z+0.020],
           [x+0.020,y-0.075+0.010*i,z+0.020],'rgba(127,214,234,'+(o.dim?0.45:0.85)+')',0.9);
  }
  for(let i=0;i<16;i++) v.dot([x+0.075,y-0.075+0.010*i,z+0.012],'#cfe9f5',0.0042);
  if(o.hl){
    const A=v.pr([x,y,z+0.02]);
    if(A){ const r=Math.max(15,v._c.F*0.17/(A.z||1));
      v.push(v.dep([x,y,z]),()=>{const g=v.g;g.strokeStyle='rgba(143,232,255,.75)';g.lineWidth=1.3;
        g.setLineDash([4,3]);g.beginPath();g.arc(A.u,A.v,r,0,7);g.stroke();g.setLineDash([]);});
    }
  }
  if(o.label!==false) v.text([x-0.15,y-0.11,z+0.05],o.label||'MPO-16FC 光纤 + 载具','#8fe8ff',{size:10.2,bold:true,prio:0});
}
// 门架工站（oz=作业头高度）
function gantry(v,s,o){
  o=o||{}; const col=o.col||C.station, on=!!o.on, hz=o.hz==null?1.24:o.hz;
  v.box(s.x-s.w/2,-0.30,TZ,s.x-s.w/2+0.03,-0.27,1.42,col,{noTop:true});
  v.box(s.x+s.w/2-0.03,-0.30,TZ,s.x+s.w/2,-0.27,1.42,col,{noTop:true});
  v.box(s.x-s.w/2,-0.31,1.36,s.x+s.w/2,-0.26,1.42,col);
  v.box(s.x-0.045,-0.16,Math.min(hz,1.34)-0.10,s.x+0.045,-0.08,Math.min(hz,1.34),on?col:'#2b3644');

function armFK(q0,q1,q2){
  const sh=armSh();
  const e=[sh[0]+ARM.L1*Math.cos(q1)*Math.cos(q0),sh[1]+ARM.L1*Math.cos(q1)*Math.sin(q0),sh[2]+ARM.L1*Math.sin(q1)];
  const a1=q1+q2;
  const w=[e[0]+ARM.L2*Math.cos(a1)*Math.cos(q0),e[1]+ARM.L2*Math.cos(a1)*Math.sin(q0),e[2]+ARM.L2*Math.sin(a1)];
  const t=[w[0]+ARM.L3*Math.cos(a1)*Math.cos(q0),w[1]+ARM.L3*Math.cos(a1)*Math.sin(q0),w[2]+ARM.L3*Math.sin(a1)];
  return {sh,e,w,t};
}
function scene10(v,t){
  grid(v,1.0); axes(v); frameCtx(v); instCtx(v);
  const w=RWP[AR.wp];
  AR.x+=clamp(clamp(w.T[0]+0.18,-1.08,1.00)-AR.x,-0.9,0.9)*0.03;
  const d=Math.hypot(AR.tip[0]-w.T[0],AR.tip[1]-w.T[1],AR.tip[2]-w.T[2]);
  const tgt=(d<0.07)?w.T:[w.T[0],w.T[1],w.T[2]+0.20];
  const ik=armIK(tgt);
  AR.q0+=(ik.q0-AR.q0)*0.12; AR.q1+=(ik.q1-AR.q1)*0.12; AR.q2+=(ik.q2-AR.q2)*0.12;
  const f=armFK(AR.q0,AR.q1,AR.q2); AR.tip=f.t;
  if(d<0.07){ AR.hold+=1/60; if(AR.hold>w.h){AR.hold=0;AR.wp=(AR.wp+1)%RWP.length;} }
  v.box(-1.22,ARM.railY-0.06,ARM.railZ-0.02,1.14,ARM.railY+0.06,ARM.railZ+0.03,'#4a3a22');
  v.text([-1.22,ARM.railY-0.12,ARM.railZ+0.05],'第七轴导轨（替代载具搬运流线）','#ffb340',{size:9.6,prio:1});

  v.box(AR.x-0.075,ARM.railY-0.07,ARM.railZ+ARM.ped,AR.x+0.075,ARM.railY+0.07,f.sh[2],'#6b5222');
  v.tube(f.sh,f.e,'#ffb340',0.030); v.tube(f.e,f.w,'#e59a2b',0.026); v.tube(f.w,f.t,'#8a6a2a',0.020);

}

      '<div class="fn">来源：技术协议 rev1.0 §2.2 第 '+c.n+' 步 / §2.1 指标 / §2.3 对接信号 / §3 硬件配置；三维为按模块关系的 1:1 示意，非施工图</div>'+
    '</div>';
  WRAP.appendChild(el);

  const v=new View(el.querySelector('canvas'),c.cam);
  v.scene=c.scene; v.card=c.n; v.focus=FOCUS[c.n];
  views.push(v);
});

const io=new IntersectionObserver(es=>{
  es.forEach(e=>{
    const v=views.find(x=>x.cv===e.target);
    if(v) v.visible=e.isIntersecting;
  });
},{rootMargin:'200px'});
views.forEach(v=>{ v.visible=true; io.observe(v.cv); });

const bSpin=document.getElementById('bSpin'), bPlay=document.getElementById('bPlay'), bLbl=document.getElementById('bLbl');
bSpin.onclick=()=>{ const on=bSpin.classList.toggle('on'); views.forEach(v=>v.spin=on?0.10:0); };
bPlay.onclick=()=>{ const on=bPlay.classList.toggle('on'); views.forEach(v=>{v.playing=on; if(on)v._frozen=null;}); };
bLbl.onclick=()=>{ const on=bLbl.classList.toggle('on'); views.forEach(v=>v.labels=on); };

/* ===================== 主循环 ===================== */
let T0=performance.now(), nFrames=0, fps=60, lastFpsT=T0, lastNow=T0;
function loop(now){
  const dt=Math.min(0.1,(now-lastNow)/1000); lastNow=now;
  const t=(now-T0)/1000;
  nFrames++;
  if(now-lastFpsT>500){ fps=nFrames*1000/(now-lastFpsT); nFrames=0; lastFpsT=now; }
  for(const v of views){
    if(v.visible===false) continue;
    v.resize(); v.cam();
    if(v.spin) v.yaw+=v.spin*dt;
    let tt=t;
    if(!v.playing){ if(v._frozen==null) v._frozen=t; tt=v._frozen; }
    v.LQ.length=0; v.TQ.length=0;
    (v.scene||function(){})(v,tt);
    v.paint();
  }
  requestAnimationFrame(loop);
}
views.forEach(v=>{ v.resize(); v.fit(v.focus); });
window.addEventListener('resize',()=>{ views.forEach(v=>{ v.resize(); v.fit(v.focus); }); });
requestAnimationFrame(loop);

/* ---------- 导出 Word（一键） ---------- */
// 内容真源就是这个页面的 CARDS：把卡片文字 + 当前视角的 canvas 截图 POST 给 8797,
// 服务端 tools/autolight_docx.py 用 python-docx 排版返回 .docx
const bDoc=document.getElementById('bDoc'), TIP=document.getElementById('tip');
const TIP0=TIP.textContent;
let tipTimer=null;
function tip(msg,ms){
  TIP.textContent=msg; clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>{TIP.textContent=TIP0;}, ms||7000);
}
function fnOf(c){
  return '来源：技术协议 rev1.0 §2.2 第 '+c.n+' 步 / §2.1 指标 / §2.3 对接信号 / §3 硬件配置；三维为按模块关系的 1:1 示意，非施工图';
}
function snapOne(c){
  const v=views.find(x=>x.card===c.n);
  if(!v) return '';
  try{
    v.resize(); v.cam();
    const t=(performance.now()-T0)/1000;
    v.LQ.length=0; v.TQ.length=0; v.scene(v,t); v.paint();
    return v.cv.toDataURL('image/png');
  }catch(e){ return ''; }
}
async function exportDocx(no){
  const list=no ? CARDS.filter(c=>c.n===String(no)) : CARDS;
  const btn=no ? document.querySelector('button[data-doc="'+no+'"]') : bDoc;
  const old=btn.textContent;
  btn.disabled=true; btn.textContent='导出中…';
  try{
    const payload={
      meta:{ts:new Date().toLocaleString('zh-CN'), url:location.href},
      cards:list.map(c=>({n:c.n,title:c.title,stage:c.stage,act:c.act,
        det:c.det,kv:c.kv,tags:c.tags,fn:fnOf(c),img:snapOne(c)}))
    };
    const r=await fetch('/api/autolight/docx',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok){
      let t=''; try{ t=await r.text(); }catch(e){}
      throw new Error('HTTP '+r.status+' '+t.slice(0,160));
    }
    const blob=await r.blob();
    const stamp=new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='工艺卡_'+(no?('第'+no+'卡'):(list.length+'卡'))+'_'+stamp+'.docx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    tip('✅ 已导出 '+(no?('第 '+no+' 张'):(list.length+' 张'))+'工艺卡：'+a.download+
        '（'+(blob.size/1024).toFixed(0)+' KB，含三维截图）');
  }catch(e){
    tip('❌ 导出失败：'+((e&&e.message)||e)+' —— 若服务端刚改过代码需重启 zmax-traj-ar',12000);
  }finally{
    btn.disabled=false; btn.textContent=old;
  }
}
bDoc.onclick=()=>exportDocx();
document.addEventListener('click',ev=>{
  const b=ev.target.closest?ev.target.closest('button[data-doc]'):null;
  if(b) exportDocx(b.getAttribute('data-doc'));
});

/* 取证接口 */
window.__AL={
  ready:true, version:'autoLight-cards-2',
  cards:()=>CARDS.map(c=>({n:c.n,title:c.title,stage:c.stage,det:c.det.length,kv:c.kv.length,tags:c.tags.length})),
  views:()=>views.map(v=>({card:v.card,W:v.W,H:v.H,faces:v.LQ.length,labels:v.drawn||0,visible:v.visible!==false})),
  fps:()=>Math.round(fps),
  scrollTo:n=>{ const el=document.getElementById('c'+n); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
};
</script>
</body>
</html>
