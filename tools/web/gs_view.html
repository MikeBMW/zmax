<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Z-MAX 3DGS 场景 · 高斯球查看器</title>
<style>
 html,body{margin:0;height:100%;background:#05070a;color:#e6edf3;overflow:hidden;
   font:13px/1.5 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
 canvas{display:block;width:100vw;height:100vh;touch-action:none}
 #bar{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;gap:8px;align-items:center;
   flex-wrap:wrap;padding:7px 10px;background:rgba(13,17,23,.9);border-bottom:1px solid #21262d}
 #bar .t{color:#7ee787;font-weight:600}
 #meta{color:#8b949e}
 select,button{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;
   padding:4px 8px;font-size:12px;max-width:52vw}
 button:active{background:#21262d}
 #hint{position:fixed;left:10px;bottom:8px;z-index:50;color:#8b949e;font-size:12px;text-shadow:0 0 3px #000}
 #err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
   max-width:88vw;background:#2d1315;border:1px solid #f85149;border-radius:8px;padding:12px 14px;
   color:#ffd7d7;white-space:pre-wrap;font-size:12px}
 /* 查看器自用节点(全部隐藏/移出视口) */
 #info{position:fixed;left:10px;top:46px;z-index:40;text-shadow:0 0 3px #000;pointer-events:none}
 #spinner{position:fixed;right:12px;top:46px;z-index:40;color:#7ee787}
 #fps,#quality,#caminfo,#camid,#progress{position:fixed;left:-9999px;top:-9999px}
</style></head><body>
<canvas id="canvas"></canvas>
<div id="bar">
  <span class="t">🧊 Z-MAX 3DGS 场景</span>
  <select id="pick" title="选择建图资产"></select>
  <button onclick="location.reload()">🔄 重载</button>
  <span id="meta">加载中…</span>
</div>
<div id="info"><div id="message"></div><div id="instructions"></div></div>
<div id="spinner">加载中…</div>
<div id="progress"></div>
<div id="quality"><span id="fps"></span></div>
<div id="caminfo"><span id="camid"></span></div>
<div id="err"></div>
<div id="hint">拖拽旋转 · 滚轮/双指缩放 · 右键或双指拖动平移</div>
<script>
/* ⚠️ 关键(Z-MAX 2026-10-08): 查看器默认相机对着**原点**、距离固定 ~6.55,
   而我们的 .splat 是**真尺度世界坐标**(场景中心约 (0.57,-0.05,0.31)) ⇒ 直接用会全黑。
   这里在浏览器里把位置整体平移到原点(尺度不动, 仍是真尺寸), 再以 blob 交给查看器。
   不动训练链路、不动资产文件、不改服务端。 */
var Q = new URLSearchParams(location.search);
var SEL = Q.get('a') || '';
function fail(t){var e=document.getElementById('err');e.style.display='block';e.textContent='❌ '+t;}
window.addEventListener('error',function(ev){fail('JS 错误: '+(ev.message||ev.type));});
window.addEventListener('unhandledrejection',function(ev){fail('加载失败: '+((ev.reason&&ev.reason.message)||ev.reason));});
function setMeta(t){document.getElementById('meta').textContent=t;}
function loadViewer(){
  var s=document.createElement('script');
  s.src='lib/splat/main.js';
  s.onerror=function(){fail('查看器 JS 取不到(lib/splat/main.js)');};
  document.body.appendChild(s);
}
function boot(name){
  var src='gs/'+(name?name+'.splat':'latest.splat');
  setMeta('拉取 '+src+' …');
  fetch(src).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' '+src);
    return r.arrayBuffer();
  }).then(function(ab){
    if(ab.byteLength % 32 !== 0) throw new Error('资产字节数不是 32 的整数倍: '+ab.byteLength);
    var n=ab.byteLength/32, f=new Float32Array(ab), o;
    var cx=0,cy=0,cz=0;
    for(var i=0;i<n;i++){o=i*8; cx+=f[o]; cy+=f[o+1]; cz+=f[o+2];}
    cx/=n; cy/=n; cz/=n;
    var mx=0,my=0,mz=0;
    for(var i=0;i<n;i++){o=i*8; f[o]-=cx; f[o+1]-=cy; f[o+2]-=cz;
      if(Math.abs(f[o])>mx)mx=Math.abs(f[o]);
      if(Math.abs(f[o+1])>my)my=Math.abs(f[o+1]);
      if(Math.abs(f[o+2])>mz)mz=Math.abs(f[o+2]);}
    /* 🔴 2026-10-08 老倪「场景图, 用鼠标左键, 要可以改变角度」:
       查看器左键旋转 = 绕「相机前方 4 个单位处」的球面轨道(d=4, main.js mousemove down==1),
       而我们的 .splat 是**真尺度**(半跨度仅 ~0.4m) ⇒ 轨道轴心落在场景外, 左键几乎转不动。
       修法: 居中后**把场景缩放到默认相机合适的尺度**(位置 ×k; 尺度是 log 域 ⇒ +ln k),
       之后完全不用改相机 = 查看器原厂行为: 左键拖=绕场景中心转, 滚轮=缩放, 右键拖=平移。
       (只改浏览器里的显示副本, 不动资产文件、不动训练链路) */
    var half = Math.max(mx, my, mz, 0.05), k = 4.5 / half, add = Math.log(k);
    for(var i=0;i<n;i++){o=i*8;
      f[o]*=k; f[o+1]*=k; f[o+2]*=k;          // 位置: 居中后再缩放
      f[o+3]+=add; f[o+4]+=add; f[o+5]+=add;}  // 尺度(log 域): 同步缩放, 否则高斯相对大小失真
    /* 🖼 2026-10-08 老倪「页面卡死了」: 查看器每帧在 CPU 上排序**全部**高斯;
       58.9 万个排序会占满主线程 ⇒ 站页假死。这里做**显示副本降采样**:
       按不透明度(alpha 字节)保留最实的 K 个 —— 视觉几乎无损(半透明雾状粒子本来就看不见),
       排序量降 5×。只改浏览器里的显示副本, 不动资产、不动训练。 */
    var KMAX = 120000;
    if(n > KMAX){
      var u8 = new Uint8Array(ab), idx = new Array(n);
      for(var i=0;i<n;i++) idx[i]=i;
      idx.sort(function(a,b){ return u8[b*32+27] - u8[a*32+27]; });   // alpha 降序
      var nb = new ArrayBuffer(KMAX*32), nd = new Float32Array(nb), sd = new Uint8Array(nb);
      for(var j=0;j<KMAX;j++){ var src=idx[j]*32, dst=j*32;
        for(var q=0;q<32;q++) sd[dst+q]=u8[src+q]; }
      ab = nb; f = nd; n = KMAX;
      setMeta('显示降采样 '+n.toLocaleString()+' / 原始 '+idx.length.toLocaleString()+' 高斯(保最实) · ');
    }
    setMeta('高斯 '+n.toLocaleString()+' · 已居中缩放 ×'+k.toFixed(1)+'(世界中心 '+cx.toFixed(2)+','+cy.toFixed(2)+','+cz.toFixed(2)+
            ' · 原半跨度 '+mx.toFixed(2)+'/'+my.toFixed(2)+'/'+mz.toFixed(2)+' m) · 左键拖转角度');
    var u=URL.createObjectURL(new Blob([ab],{type:'application/octet-stream'}));
    /* 2026-10-08: 不再用 hash 改相机(那样左键轨道轴心在场景外, 老倪「左键转不了角度」的根因)。
       场景已按默认相机尺度缩放 ⇒ 交给查看器原厂相机与控件。 */
    try{history.replaceState(null,'',location.pathname+'?url='+encodeURIComponent(u));}catch(e){}
    loadViewer();
  }).catch(function(e){ setMeta('资产拉取失败: '+e); loadViewer(); });
}
fetch('gs/list').then(function(r){return r.json();}).then(function(d){
  var sel=document.getElementById('pick'), a=d.assets||[];
  if(!a.length){setMeta('还没有任何 3DGS 资产');return;}
  a.forEach(function(x){
    var o=document.createElement('option');
    o.value=x.name; o.textContent=x.name+' · '+(x.mtime||'').slice(5);
    if((SEL&&x.name===SEL)||(!SEL&&x.name===d.latest))o.selected=true;
    sel.appendChild(o);});
  var hit=a.filter(function(x){return x.name===(SEL||d.latest);})[0]||a[0];
  if(hit.psnr_holdout_db) setMeta('留出 PSNR '+hit.psnr_holdout_db+' dB · 建图 '+hit.mtime+' · 加载中…');
  sel.onchange=function(){location.search='?a='+encodeURIComponent(sel.value);};
}).catch(function(){});
boot(SEL);
</script>
</body></html>
