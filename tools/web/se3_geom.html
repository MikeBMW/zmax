<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>Z-MAX · SE(3) 分层几何看板</title>
<style>
:root{--bg:#0b0f14;--fg:#e6eef5;--dim:#93a4b3;--acc:#37d0ff;--warn:#ffb020;--ok:#3ddc84;
      --fs:17.3px;--fs2:15px;--fs3:16px;--fs4:19.6px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.6 -apple-system,"Segoe UI","Noto Sans CJK SC",Ubuntu,sans-serif}
header{padding:12px 18px;border-bottom:1px solid #1b242c;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:var(--fs4);margin:0;font-weight:600;letter-spacing:.2px}
h1 small{color:var(--dim);font-weight:400;font-size:var(--fs2)}
h1+.hint,.hint{color:var(--dim);font-size:var(--fs2);line-height:1.5;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:auto;gap:12px;padding:12px;
  grid-template-areas:"a a a e e e" "b b c c d d"}
.g-a{grid-area:a}.g-b{grid-area:b}.g-c{grid-area:c}.g-d{grid-area:d}.g-e{grid-area:e}
.card{background:#0e141a;border:1px solid #1b242c;border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.hd h2{font-size:var(--fs3);margin:0;color:var(--acc);font-weight:600;letter-spacing:.3px;white-space:nowrap}
.hd .sub{color:var(--dim);font-size:var(--fs2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{display:block;width:100%;border-radius:6px}
#a,#e{height:520px}#b,#c,#d{height:250px}
.row{display:flex;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid #1b242c;flex-wrap:wrap;font-size:var(--fs3)}
input[type=range]{width:min(340px,40vw)}
button{background:#16202a;color:var(--fg);border:1px solid #243441;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:var(--fs3)}
button:hover{border-color:var(--acc)}
button.on{border-color:var(--acc);color:var(--acc)}
.legend{display:flex;gap:14px;font-size:var(--fs2);color:var(--dim);flex-wrap:wrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
/* ◆ 相位高亮徽标: 大字百分比 + 文字状态, 三态配色(运行/停留/已到位) */
.g-e{position:relative}
.stops{position:absolute;top:42px;right:8px;width:47%;max-height:calc(100% - 50px);overflow-y:auto;
  display:flex;flex-direction:column;gap:3px;padding:2px 2px 4px 0;font:12.5px/1.5 ui-monospace,Menlo,monospace}
.stops .hd2{display:flex;justify-content:space-between;color:#8fa6bb;font-size:11.5px;padding:0 2px 2px}
.stops .r{display:flex;align-items:center;gap:5px;background:#0e141a;border:1px solid #22303c;
  border-left:3px solid #4ea3ff;border-radius:5px;padding:2px 4px 2px 5px}
.stops .r.cur{background:#16222c;border-color:#3ddc84;box-shadow:0 0 0 1px #3ddc8444}
.stops .r .i{color:#7c93a8;font-size:11px;min-width:30px;text-align:right}
.stops .r input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed #2c3d4d;
  color:#dbe7f0;font:inherit;padding:1px 2px;outline:none}
.stops .r input:focus{border-bottom-color:#3ddc84;background:#0b1219}
.stops .r button{background:#20141a;border:1px solid #5a2530;color:#ff8b8b;border-radius:4px;
  font-size:11px;line-height:1;padding:3px 5px;cursor:pointer}
.stops .r button:hover{background:#341820;border-color:#ff5f6d;color:#ffb3b3}
.ph-badge{position:absolute;left:18px;top:46px;z-index:4;display:flex;align-items:center;gap:14px;
  padding:9px 16px;border-radius:13px;background:rgba(8,17,26,.88);border:1.5px solid #243441;
  box-shadow:0 6px 22px rgba(0,0,0,.5);pointer-events:none}
.ph-badge .lab{font-size:10.5px;letter-spacing:2px;color:#7f93a4;margin-bottom:2px}
.ph-badge .pct{font-size:36px;font-weight:800;line-height:.95;letter-spacing:.5px;
  font-variant-numeric:tabular-nums;text-shadow:0 0 18px currentColor}
.ph-badge .rt{display:flex;flex-direction:column;gap:6px}
.ph-badge .st{font-size:15px;font-weight:800;padding:4px 12px;border-radius:999px;letter-spacing:1px;text-align:center}
.ph-badge .bar{width:132px;height:7px;border-radius:4px;background:#16202a;overflow:hidden}
.ph-badge .bar>i{display:block;height:100%;width:0%;background:currentColor;transition:width .12s linear}
.ph-badge.run{border-color:#2b8a5e;color:#3ddc84}
.ph-badge.run .st{background:rgba(61,220,132,.18);color:#3ddc84}
.ph-badge.hold{border-color:#8a6519;color:#f5a623}
.ph-badge.hold .st{background:rgba(245,166,35,.18);color:#f5a623}
.ph-badge.done{border-color:#1f6d92;color:#37d0ff}
.ph-badge.done .st{background:rgba(55,208,255,.18);color:#37d0ff}
body.focus-s1 .grid{grid-template-columns:1fr 1fr;grid-template-areas:"d e"}
body.focus-s1 .g-a,body.focus-s1 .g-b,body.focus-s1 .g-c{display:none}
body.focus-s1 #d,body.focus-s1 #e{height:460px}
body.focus-s1 header h1 small{display:none}
@media (max-width:1100px){.grid{grid-template-columns:1fr 1fr;grid-template-areas:"a a" "e e" "b c" "d d"}
  #a,#e{height:440px}}
@media (max-width:760px){.grid{grid-template-columns:1fr;grid-template-areas:"a" "e" "b" "c" "d"}
  #a,#e{height:380px}#b,#c,#d{height:300px}}

  let g=best, gd=bd;

  const tw=w+pad*2+16;
  if(x+tw>cw-6) x=Math.max(6,cw-6-tw);
  if(y-hh/2<4) y=hh/2+4;
  if(y+hh/2>ch-4) y=ch-4-hh/2;
  g.save();
  g.fillStyle='rgba(8,13,19,0.86)';
  if(g.roundRect){g.beginPath();g.roundRect(x,y-hh/2,w+pad*2+16,hh,hh/2.6);g.fill();}
  else{g.fillRect(x,y-hh/2,w+pad*2+16,hh);}
  g.fillStyle=accent||'#3ddc84';
  g.beginPath();g.arc(x+pad+4,y,3.6,0,6.2832);g.fill();
  g.fillStyle='#f2f7fb';g.textBaseline='middle';
  g.fillText(text,x+pad+14,y+1);

function line(g,a,b,c,w){g.strokeStyle=c;g.lineWidth=w||1;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
function circle(g,x,y,r,c,w,fill){g.beginPath();g.arc(x,y,r,0,6.2832);if(fill){g.fillStyle=fill;g.fill();}g.strokeStyle=c;g.lineWidth=w||1;g.stroke();}
function hsl(i,n){return 'hsl('+(i/n*300)+',85%,58%)';}

// ── A: 位置 ℝ³
function drawA(){
  const cv=document.getElementById('a'),{g,w,h}=fit(cv);
  const ps=F.map(f=>f.p), cen=[0,1,2].map(k=>ps.reduce((s,p)=>s+p[k],0)/N);
  const rel=ps.map(p=>[p[0]-cen[0],p[1]-cen[1],p[2]-cen[2]]);
  const R=520;                                  // 以 mm 为单位缩放到画布
  const sc=Math.min(w,h)*0.42/R, cx=w/2, cy=h/2+18;
  const PT=rel.map(p=>proj(cv,p,cam.yaw,cam.pitch,sc,cx,cy));   // 注意: 不能叫 P, 会遮蔽字号函数 P()
  // 包围盒
  const mn=[0,1,2].map(k=>Math.min(...rel.map(p=>p[k]))), mx=[0,1,2].map(k=>Math.max(...rel.map(p=>p[k])));
  const corners=[];for(let i=0;i<8;i++)corners.push([i&1?mx[0]:mn[0],i&2?mx[1]:mn[1],i&4?mx[2]:mn[2]]);
  const C=corners.map(p=>proj(cv,p,cam.yaw,cam.pitch,sc,cx,cy));
  const E=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  g.globalAlpha=.35;E.forEach(([i,j])=>line(g,C[i],C[j],'#2c3e4d',1));g.globalAlpha=1;
  // 路径
  for(let i=1;i<N;i++){
    const col=showPhase?hsl((F[i].s!=null?F[i].s:i/N)*N,N):'#2f4a5e';
    g.globalAlpha=(i<=idx)?1:.35;
    line(g,PT[i-1],PT[i], col, (i<=idx)?2:1);
  }
  g.globalAlpha=1;
  // 速度箭头(TQ): 每 6 帧一根, 长度 ∝ 速度档
  if(showSpd){
    for(let i=6;i<N;i+=6){
      const a=PT[i], d=[PT[i][0]-PT[i-3<0?0:i-3][0], PT[i][1]-PT[i-3<0?0:i-3][1]];
      const L=Math.hypot(d[0],d[1])||1, k=(F[i].spd/100)*1.9+0.35;
      const b=[a[0]+d[0]/L*11*k, a[1]+d[1]/L*11*k];
      g.globalAlpha=.9;line(g,a,b,SPC[F[i].spd]||'#888',1.6);
      g.beginPath();g.fillStyle=SPC[F[i].spd]||'#888';g.arc(b[0],b[1],1.7,0,6.28);g.fill();
    }
    g.globalAlpha=1;
  }
  // 停留点: 与 E 面板同一套编号①②③④⑤, 环上/空间里都只标序号(不再往点旁边堆 "#9" 文字, 会互相压)
  const SPN=[9,125,151,172,205];
  SPN.forEach((si,k)=>{
    const p=PT[si]; if(!p) return;
    const col=(si===9||si===205)?'#ffd166':'#9fe8ff';
    g.beginPath();g.arc(p[0],p[1],9.5,0,6.2832);g.fillStyle='rgba(8,17,26,0.9)';g.fill();
    g.save();g.translate(p[0],p[1]);g.rotate(Math.PI/4);
    g.fillStyle=col;g.fillRect(-3.4,-3.4,6.8,6.8);
    g.strokeStyle='#08111a';g.lineWidth=1.2;g.strokeRect(-3.4,-3.4,6.8,6.8);g.restore();
    g.textAlign='center';g.fillStyle='#08111a';g.font='700 '+P(9)+'px sans-serif';
    g.fillText(String(k+1),p[0],p[1]+P(3));g.textAlign='start';
  });
  // 当前点
  const c=PT[idx];circle(g,c[0],c[1],6,'#fff',2,'#0e141a');
  if(LIVE&&LIVE.tcp_mm&&LIVE.nearest){
    const lp=[LIVE.tcp_mm[0]-cen[0],LIVE.tcp_mm[1]-cen[1],LIVE.tcp_mm[2]-cen[2]];
    const q=proj(cv,lp,cam.yaw,cam.pitch,sc,cx,cy);
    g.strokeStyle='#3ddc84';g.lineWidth=2;g.beginPath();g.arc(q[0],q[1],9,0,6.2832);g.stroke();
  }
  // 🏷 文字区: 统一面板 + 自动折行 + 高度超限自动缩号 ⇒ 任何字号下都不重叠 / 不裁字 / 不出画布
  const rowsSrc=[
    {t:'#'+idx+'   '+F[idx].p.map(v=>v.toFixed(0)).join(' / ')+' mm', fs:19, w:'600', c:'#f2f7fb'},
    {t:'包围盒 636×922×884 mm · 弧长 7.86 m · 215 帧', fs:15, w:'', c:'#8fa3b3'}];
  if(LIVE&&LIVE.nearest) rowsSrc.push({t:'● 现在 #'+LIVE.nearest.i+'   s '+(LIVE.nearest.s*100).toFixed(1)+
      '%   偏轨 '+LIVE.nearest.dist_mm+' mm   帧龄 '+(LIVE.age_s||0).toFixed(1)+'s', fs:16, w:'600', c:'#3ddc84'});
  rowsSrc.push({t:'① 合爪  ②③ 金手指AOI  ④ 表面AOI  ⑤ 松爪·放置', fs:13.5, w:'', c:'#c9a35a'});

  const fntOf=(r,sm)=>((r.w?r.w+' ':'')+P(r.fs*sm)+'px -apple-system,"Segoe UI",sans-serif');
  const buildPanel=(sm)=>{
    const pad=Math.round(P(11)*Math.max(sm,0.8)), gap=Math.round(P(5)*Math.max(sm,0.8));
    const maxw=w-16-pad*2, out=[];
    const wrapOne=(r,sep)=>{
      g.font=fntOf(r,sm);
      const parts=r.t.split(sep), outc=[]; let cur='';
      parts.forEach((seg,k)=>{
        const piece=(k===0?'':sep)+seg;
        if(g.measureText(cur+piece).width>maxw && cur){outc.push(cur.replace(/\s+$/,''));cur=piece.trim();}
        else cur+=piece;
      });
      if(cur.trim()) outc.push(cur.replace(/\s+$/,''));
      return outc;
    };
    rowsSrc.forEach(r=>{
      g.font=fntOf(r,sm);
      const f=fntOf(r,sm), fsz=P(r.fs*sm);
      if(g.measureText(r.t).width<=maxw){out.push({...r,t:r.t,f,fsz});return;}
      let parts=wrapOne(r,/(\s{3,}|\s·\s)/);
      parts=parts.flatMap(s=>{g.font=f;return g.measureText(s).width>maxw?wrapOne({...r,t:s},/(\s+)/):[s];});
      parts.forEach(t=>out.push({...r,t,f,fsz}));
    });
    let widest=0; out.forEach(o=>{g.font=o.f;widest=Math.max(widest,g.measureText(o.t).width);});
    const H=out.reduce((a,o)=>a+o.fsz+gap,0)+pad*2-gap;
    return {rows:out,pad,gap,W:Math.min(w-16,widest+pad*2),H};
  };
  let sm=1, PB=buildPanel(1);
  while(PB.H>h*0.52 && sm>0.55){sm=+(sm-0.1).toFixed(2); PB=buildPanel(sm);}
  g.fillStyle='rgba(8,13,19,0.82)';
  if(g.roundRect){g.beginPath();g.roundRect(8,8,PB.W,PB.H,9);g.fill();}
  else g.fillRect(8,8,PB.W,PB.H);
  let yy=8+PB.pad;
  PB.rows.forEach(o=>{yy+=o.fsz*0.82;g.font=o.f;g.fillStyle=o.c;g.fillText(o.t,8+PB.pad,yy);yy+=o.fsz*0.18+PB.gap;});
  window.A_PANEL={w:Math.round(PB.W),h:Math.round(PB.H),lines:PB.rows.length,sm:+sm.toFixed(2),
                  fonts:PB.rows.map(o=>o.fsz), canvas:[Math.round(w),Math.round(h)]};
  document.getElementById('aSub').textContent='X'+F[idx].p[0].toFixed(0)+' Y'+F[idx].p[1].toFixed(0)+' Z'+F[idx].p[2].toFixed(0)+' mm';
}

// ── E: 相位 S¹(扇形 + 状态文字 + 节拍构成)
const SPDC={'100':'#37d0ff','85':'#3ddc84','70':'#f5a623','60':'#e0563f'};
// 🔴 相位环/清单的颜色按"状态"上色(同一状态永远同一色); 速度档色只管节拍构成饼
const STC={'初始点':'#8f7bff','起始点':'#8f7bff','起始接近':'#8f7bff','转移':'#4ea3ff','下降':'#ff9f43',
           '抓取点':'#56d9a6','抓取(合爪)':'#56d9a6','上升':'#b18cff','扫码点':'#00e0c6',
           '对位点':'#ffd166','对位':'#ffb84d','力控搜索':'#c792ea','插入':'#ff7b72',
           '推进':'#f78fb3','退出':'#8fa3b3','拔出':'#ffab5e','准备拔出':'#ffab5e','设备工作点':'#ff5f6d',
           '拔出点':'#ffab5e','过渡点':'#9aa7b4','下探':'#7cc7ff','废料点':'#e05a5a',
           '操作区':'#ff6b8a','放置(松爪)':'#2fb3a3',
           '金手指 AOI':'#d76bd0','表面检测':'#b8cc5e'};
// 状态色与速度档色(#37d0ff/#3ddc84/#f5a623/#e0563f)刻意错开, 免得同一个青同时表示"转移"和"100档"
const STC_FALL=['#8fa3b3','#c0a26b','#7fa7c8','#c98f8f','#9ec08a'];
function stc(name){const k=String(name||'').trim();
  if(STC[k]) return STC[k];
  let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))%997;
  return STC_FALL[h%STC_FALL.length];}
function spdc(v){const k=String(Math.round(v));return SPDC[k]||'#8fa3b3';}
let E_SECT=null, E_GEO={};

const DOM_STOPS=true;      // 右侧状态清单改用 DOM 渲染: 每行一个真输入框(改名) + ✕(删点)

function drawE(){
  const cv=document.getElementById('e'),{g,w,h}=fit(cv);clear(cv);
  const prog_ref=(f)=> (f&&f.prog!=null)?f.prog:PROG[Math.max(0,Math.min(N-1,f&&f.i!=null?f.i:idx))];
  const s_live=(LIVE&&LIVE.nearest)?prog_ref(LIVE.nearest):PROG[idx];
  const _pr_pct=Math.max(0,Math.min(100,s_live*100));
  const SEC=(LIVE&&LIVE.sectors)||null; E_SECT=SEC;
  try{ if(DOM_STOPS) renderStates(SEC, s_live); }catch(e){}
  const tall=h>=320;
  // 放大版(E 现在与 A 并列, 约半屏宽): 圆环/饼/清单都按画布实际尺寸长, 不再被 60px 封顶
  const RO=Math.min(h*0.33, w*0.205, tall?140:64), RI=RO-Math.max(12,RO*0.12);
  const cx=14+RO, cy=tall?h*0.44:h*0.50;
  E_GEO={cx,cy,RO,RI};
  circle(g,cx,cy,RO,'#22303c',1);circle(g,cx,cy,RI,'#22303c',1);
  if(SEC&&SEC.states&&SEC.states.length){
    /* 🔴 扇区 = 我标的 13 个工艺段(老倪 2026-11-21「239 个点 … 更新到相位图 S1, 自己标注状态」)
       每段一个颜色, 首尾相接覆盖 0..238, 不再被实测块的 15/100 速度档碎成 54 个色块。*/
    const NS=SEC.states.length;
    SEC.states.forEach((s,k)=>{
      const a0=(s.s0!=null?s.s0:s.i0/(N-1))*6.2832-Math.PI/2;
      const a1=(s.s1!=null?s.s1:s.i1/(N-1))*6.2832-Math.PI/2;
      const wdt=Math.max(a1-a0,0.012), c0=(a0+a1)/2-wdt/2, c1=c0+wdt;
      g.beginPath();g.arc(cx,cy,RO-0.8,c0,c1);g.arc(cx,cy,RI+1.5,c1,c0,true);g.closePath();
      g.fillStyle=s.color||stc(s.name); g.fill();
      g.strokeStyle='#0b1117';g.lineWidth=0.8;g.stroke();
      // 段号(1..13) 标在扇区中线靠外, 名字在右侧清单里(环上塞不下 13 个中文名)
      const am=(c0+c1)/2, rr=(RO+RI)/2;
      g.save();g.textAlign='center';g.textBaseline='middle';
      g.font='700 '+P(Math.max(8,RO*0.085))+'px sans-serif';
      g.fillStyle='rgba(6,12,18,.85)';
      g.fillText(String(k+1), cx+Math.cos(am)*rr, cy+Math.sin(am)*rr);
      g.restore();
    });
  }else if(SEC&&SEC.blocks&&SEC.blocks.length){
    const tmax=Math.max(...SEC.blocks.map(b=>b.t_s||0),1);
    SEC.blocks.forEach(b=>{
      const a0=b.s0*6.2832-Math.PI/2, a1=b.s1*6.2832-Math.PI/2;
      const th=(5+10*Math.min(1,(b.t_s||0)/tmax))*(RO/64);   // 环变大时扇区厚度同比放大
      const r0=Math.max(RI+1.5, RO-th);
      const col=stc(b.state);   // 扇区色 = 状态色(与右侧文字一致)
      const wdt=Math.max(a1-a0,0.010), c0=(a0+a1)/2-wdt/2, c1=c0+wdt;
      g.beginPath();g.arc(cx,cy,RO-0.8,c0,c1);g.arc(cx,cy,r0,c1,c0,true);g.closePath();
      g.fillStyle=col;g.fill();g.strokeStyle='#0b1117';g.lineWidth=0.7;g.stroke();
      if(a1-a0<0.010){const am=(a0+a1)/2;
        line(g,[cx+Math.cos(am)*r0,cy+Math.sin(am)*r0],[cx+Math.cos(am)*(RO+0.6),cy+Math.sin(am)*(RO+0.6)],col,2.2);}
    });
  }else{
    for(let i=0;i<N;i+=3){const a=((F[i].s!=null?F[i].s:i/(N-1)))*6.2832-Math.PI/2;
      line(g,[cx+Math.cos(a)*(RO-4),cy+Math.sin(a)*(RO-4)],[cx+Math.cos(a)*RO,cy+Math.sin(a)*RO],'#2c3e4d',1);}
  }
  // ◆ 停留点标记(夹爪/AOI): 菱形 + 停留时长弧 + 名称, 与"现在"的绿圆点明显区分
  if(SEC&&SEC.stops){
    const rs=Math.max(6.2,RO*0.062);
    let lastAng=null, lastR=22;
    SEC.stops.forEach((sp,k)=>{
      if(sp.s==null) return;
      const ang=sp.s*6.2832-Math.PI/2;
      const X=cx+Math.cos(ang)*RO, Y=cy+Math.sin(ang)*RO;
      const col=(sp.kind==='grip')?'#ffd166':'#9fe8ff';
      // 停留时长: 弧长∝毫秒(夹爪 2000/2600 能看出长短); AOI 无固定毫秒 ⇒ 固定短线
      const dw=sp.hold_ms?(0.07+0.18*Math.min(1,sp.hold_ms/2600)):0.075;
      g.beginPath();g.arc(cx,cy,RO+7.5,ang-dw/2,ang+dw/2);
      g.strokeStyle=col;g.lineWidth=Math.max(2.6,RO*0.026);g.stroke();
      // 深色光晕(压在彩色扇区上也看得见) + 菱形 + 中心孔
      g.beginPath();g.arc(X,Y,rs*2.0,0,6.2832);g.fillStyle='rgba(8,17,26,0.92)';g.fill();
      g.beginPath();g.arc(X,Y,rs*1.62,0,6.2832);g.strokeStyle=col;g.lineWidth=1.1;g.stroke();
      g.save();g.translate(X,Y);g.rotate(Math.PI/4);
      g.fillStyle=col;g.fillRect(-rs*0.74,-rs*0.74,rs*1.48,rs*1.48);
      g.strokeStyle='#08111a';g.lineWidth=1.4;g.strokeRect(-rs*0.74,-rs*0.74,rs*1.48,rs*1.48);
      g.restore();
      g.beginPath();g.arc(X,Y,rs*0.30,0,6.2832);g.fillStyle='#08111a';g.fill();
      // 环左半边放不下外侧文字(环几乎贴到画布左边) ⇒ 环上只标序号, 名字走底部停留点清单
      g.textAlign='center';
      g.fillStyle='#08111a';g.font='700 '+P(9)+'px sans-serif';
      g.fillText(String(k+1),X,Y+P(3));
      g.textAlign='start';
    });
  }
  // 已完成相位(外侧亮环) + 当前点
  g.beginPath();g.arc(cx,cy,RO+4,-Math.PI/2,-Math.PI/2+Math.max(0.0001,s_live)*6.2832);
  g.strokeStyle='#3ddc84';g.lineWidth=2.6;g.stroke();
  const a=s_live*6.2832-Math.PI/2;
  line(g,[cx,cy],[cx+Math.cos(a)*RI*0.94,cy+Math.sin(a)*RI*0.94],'rgba(255,255,255,.28)',1.1);
  circle(g,cx+Math.cos(a)*RO,cy+Math.sin(a)*RO,4.2,'#3ddc84',1.5,'#08111a');
  // 环内读数
  const _ei=(LIVE&&LIVE.nearest)?LIVE.nearest.i:idx;
  g.textAlign='center';
  g.fillStyle='#f2f7fb';g.font='600 '+P(tall?21:16)+'px sans-serif';
  g.fillText((s_live*100).toFixed(1)+'%',cx,cy+2);
  g.fillStyle='#8fa3b3';g.font=P(tall?13.5:11.5)+'px sans-serif';
  g.fillText('#'+_ei+' · '+Math.round(((LIVE&&LIVE.nearest&&LIVE.nearest.s_mm)||F[idx].s_mm||0))+'mm',cx,cy+P(tall?18:13));
  g.textAlign='start';
  // ◆ 状态文字: 把连续同状态的块合并成"状态段", 在环外标名字 + 该段耗时
  let E_RUNS=[];
  if(SEC&&SEC.blocks&&SEC.blocks.length){
    const runs=[];
    SEC.blocks.forEach(b=>{
      const last=runs[runs.length-1];
      if(last&&last.state===b.state){last.s1=b.s1;last.t+=b.t_s||0;last.n++;last.speed=Math.min(last.speed,b.speed||999);}
      else runs.push({state:b.state,s0:b.s0,s1:b.s1,t:b.t_s||0,n:1,speed:b.speed||0});
    });
    E_RUNS=runs;
    // 径向文字: 只给"放得下"的状态段画(贴边会被夹到环上⇒压住扇形, 宁可让右侧清单兜底)
    const placed=[];
    runs.filter(x=>x.t>=3).sort((x,y)=>y.t-x.t).slice(0,6).forEach(x=>{
      const mid=((x.s0+x.s1)/2)*6.2832-Math.PI/2;
      if(placed.some(q=>Math.abs(((mid-q+Math.PI)%6.2832+6.2832)%6.2832-Math.PI)<0.46)) return;
      const txt=x.state+' '+x.t.toFixed(0)+'s';
      g.font='600 '+P(12)+'px sans-serif';
      const tw=g.measureText(txt).width, axRaw=cx+Math.cos(mid)*(RO+14), ly=cy+Math.sin(mid)*(RO+14);
      const ax=Math.cos(mid)>=0? axRaw+6 : axRaw-tw-P(12)*1.5-12;
      if(ax<6||ax+tw+P(20)>w-4||ly<12||ly>h-10) return;      // 放不下就放弃, 交给右侧清单
      placed.push(mid);
      line(g,[cx+Math.cos(mid)*(RO+1),cy+Math.sin(mid)*(RO+1)],
             [cx+Math.cos(mid)*(RO+9),cy+Math.sin(mid)*(RO+9)],stc(x.state),1.2);
      chip(g,ax,ly,txt,stc(x.state),P(12));
    });
  }
  // ◆ 小饼: 节拍时间构成(角度=时间占比)
  if(SEC&&SEC.tiers&&SEC.tiers.length){
    const pr=Math.min(h*(tall?0.15:0.22), tall?62:42);
    const px=Math.min(w-46-pr*2, cx+RO+pr+30), py=cy;
    let acc=-Math.PI/2;
    SEC.tiers.forEach(t=>{const a1=acc+t.frac*6.2832;
      g.beginPath();g.moveTo(px,py);g.arc(px,py,pr,acc,a1);g.closePath();
      g.fillStyle=t.color;g.fill();g.strokeStyle='#0b1117';g.lineWidth=1;g.stroke();acc=a1;});
    circle(g,px,py,pr,'#2c3e4d',1);
    g.textAlign='center';
    g.fillStyle='#e6eef5';g.font='600 '+P(12)+'px sans-serif';
    g.fillText((SEC.total_s||0).toFixed(0)+'s',px,py-1);
    g.fillStyle='#7b8b99';g.font=P(10)+'px sans-serif';
    g.fillText((SEC.n_blocks||0)+' 块',px,py+P(11));
    g.textAlign='start';
    // ◆ 右侧: 状态时间清单(扇形旁边那块文字的真正兜底, 按状态聚合, 不缺项)
    const x0=px+pr+10;
    if(!DOM_STOPS && E_RUNS.length && (w-x0)>=112){   // 窄版放不下就只留饼+图例, 不许裁字
      // 当前所在块/状态 + 该状态已用时间(实时)
      const _blocks=SEC.blocks||[];
      const _curB=_blocks.find(b=>s_live>=b.s0&&s_live<b.s1)||_blocks[_blocks.length-1]||null;
      const _curState=_curB?_curB.state:null;
      const _planOf=(st)=>{let p=0;_blocks.forEach(b=>{if(b.state===st)p+=b.t_s;});return p;};
      const _usedOf=(st)=>{let u=0;_blocks.forEach(b=>{if(b.state!==st)return;
          if(b.s1<=s_live)u+=b.t_s;
          else if(b.s0<s_live&&s_live<b.s1)u+=b.t_s*(s_live-b.s0)/Math.max(1e-9,b.s1-b.s0);});return u;};
      // 🔴 必须按**相位先后**排(上→下就是轨迹走向), 按耗时排会让方框随执行上下乱跳
      const all=[...E_RUNS].sort((a,b)=>a.s0-b.s0);
      // 🔴 同一时刻只能有一个方框: 先按相位区间选出**唯一**当前段(对象引用), 后面用 === 比较;
      //    之前按"区间条件"逐行判断, 末段 s1 重叠时会同时点亮多行。
      // 🔴 地标行(抓取点/扫码点)是零宽度(s0==s1), 用区间判断永远选不中 ⇒ 改成"按 s0 排序后接管到下一条 s0"
      let _curRun=null;
      for(let _k=0;_k<all.length;_k++){
        const _a=all[_k].s0, _b=(_k+1<all.length? all[_k+1].s0 : 1.0001);
        if(s_live>=_a-1e-9 && s_live<_b){ _curRun=all[_k]; break; }
      }
      // 地标点(抓取点/扫码点/设备工作点/拔出点/废料点)零宽度, 紧邻的下一条 s0 只差 ~0.001
      // ⇒ 停在点上时会被"下一条"抢走。凡是 s_live 落在地标 ±0.3% 内, 一律判为地标。
      let _lm=null, _lmd=1e9;
      all.forEach(r=>{ const d=Math.abs(s_live-r.s0);
        if(Math.abs(r.s1-r.s0)<1e-9 && d<0.003 && d<_lmd){ _lm=r; _lmd=d; } });   // 取**最近**的地标, 不是第一个
      if(_lm) _curRun=_lm;
      if(!_curRun && s_live>=0.9995){ let best=null;
        all.forEach(r=>{ if(r.s1>=0.999 && (!best || r.s1>best.s1)) best=r; }); _curRun=best; }
      // 🔴 行数必须按画布剩余高度算, 否则 27 段会一路画到 y=905(canvas 只有 520)全被裁掉
      const _top=cy-pr+4, _avail=Math.max(P(60), h-12-_top);
      const _curIdx=Math.max(0, all.indexOf(_curRun));
      // 🔴 行距下限 20px: 之前压到 12px 全塞进去 ⇒ 字挤成一坨; 宁可只显示一屏 + 窗口跟住当前行
      const _rowPitch=Math.max(P(20), Math.min(P(26), _avail/Math.max(1,all.length)));
      const _maxRows=Math.max(1, Math.floor(_avail/_rowPitch));
      let _start=0;
      if(all.length>_maxRows){
        _start=Math.max(0, Math.min(all.length-_maxRows, _curIdx-Math.floor(_maxRows*0.72)));   // 当前行上方留 10 行上下文(抓取/扫码这种成对动作要能同时看到)
      }
      const list=(h>=320? all.slice(_start,_start+_maxRows) : all.slice(0,3));
      const _fs=Math.max(P(10), Math.min(P(13), _rowPitch*0.56));
      // ◆ 右侧状态清单: 每一行套一个高亮方框(深底 + 同色描边 + 左侧色条), 与环上径向文字区分开
      //    并且"当前所在状态"要活: 行高亮 + 已用/计划 实时增长
      E_BOXES=[]; try{window.__eBoxes=E_BOXES;}catch(e){}
      const _segPct=_curB? Math.round(100*Math.max(0,Math.min(1,(s_live-_curB.s0)/Math.max(1e-9,_curB.s1-_curB.s0)))) : 0;
      const hdTxt=_curState? ('现在 '+_curState+' · 段内 '+_segPct+'%') : '状态 · 耗时 · 占比 · 档位';
      g.font='700 '+P(tall?12.5:11.5)+'px sans-serif';
      const hw=g.measureText(hdTxt).width;
      g.fillStyle=_curState?stc(_curState):'#b8c9d6';g.fillText(hdTxt,x0+2,cy-pr-14);
      list.forEach((x,i)=>{
        const y=_top+i*_rowPitch+_rowPitch*0.5+_fs*0.36;
        // 🔴 同一状态在轨迹里会出现多次(往返), 只能按"相位区间"判当前, 不能按状态名
        const isCur=(_curRun===x);                 // 唯一当前段(对象同一性)
        const _plan=x.t;
        const _used=isCur? _plan*Math.max(0,Math.min(1,(s_live-x.s0)/Math.max(1e-9,(x.s1-x.s0)))) : null;
        const t1=x.state;
        const t2=(isCur? (Math.min(_used,_plan).toFixed(0)+'/'+_plan.toFixed(0)+'s') : (x.t.toFixed(0)+'s'))
                 +' '+(x.t/SEC.total_s*100).toFixed(0)+'% '+Math.round(x.speed)+'档';
        g.font=P(_fs)+'px sans-serif';
        const w1=g.measureText(t1).width, w2=g.measureText(t2).width;
        const _bh=_rowPitch-P(4);
        const bx=x0-7, bw=Math.min(w1+w2+P(30), w-(x0-7)-5), bh=_bh, by=y-_bh*0.5-_fs*0.36;
        if(isCur){                                   // ◆ 只有"现在跑到的那一个状态"才有方框
          if(g.roundRect){
            g.beginPath();g.roundRect(bx,by,bw,bh,4.5);
            g.fillStyle='rgba(34,52,70,.97)';g.fill();
            g.strokeStyle=stc(x.state);g.lineWidth=2.2;g.stroke();
            g.beginPath();g.roundRect(bx+2.5,by+2.5,5,bh-5,1.8);g.fillStyle=stc(x.state);g.fill();
            g.beginPath();g.arc(bx+bw-P(7),by+bh*0.5,P(2.6),0,6.2832);g.fillStyle=stc(x.state);g.fill();
          } else { g.fillStyle='rgba(34,52,70,.97)';g.fillRect(bx,by,bw,bh);
                   g.strokeStyle=stc(x.state);g.lineWidth=2;g.strokeRect(bx,by,bw,bh); }
        }
        g.fillStyle=stc(x.state);g.font='700 '+P(tall?12.5:11)+'px sans-serif';g.fillText(t1,bx+P(10),y);   // 文字色 = 环上扇区色
        g.fillStyle='#9fb3c4';g.font=P(tall?12.5:11)+'px sans-serif';g.fillText(t2,bx+P(10)+w1+P(7),y);
        E_BOXES.push({x:bx,y:by,w:bw,h:bh,state:x.state,speed:x.speed,color:stc(x.state),
                      cur:!!isCur, used:isCur?+_used.toFixed(2):null, label:t2});
      });
      if(all.length>list.length){
        const y=_top+list.length*_rowPitch+_rowPitch*0.5+_fs*0.36;
        const more='⋯ 另 '+(all.length-list.length)+' 段';
        g.font=P(tall?13:11.5)+'px sans-serif';
        const bw2=g.measureText(more).width+P(22), bh2=P(tall?19:15.5), by2=y-P(tall?13:11.5);
        if(g.roundRect){g.beginPath();g.roundRect(x0-7,by2,bw2,bh2,4.5);
          g.fillStyle='rgba(18,30,41,.92)';g.fill();g.strokeStyle='rgba(150,175,200,.30)';g.lineWidth=1;g.stroke();}
        g.fillStyle='#8fa3b3';g.fillText(more,x0+4,y);
        E_BOXES.push({x:x0-7,y:by2,w:bw2,h:bh2,state:more,speed:-1});
      }
    }
    // 图例
    let lx=8;const ly=h-8;
    SEC.tiers.forEach(t=>{
      g.beginPath();g.arc(lx+5,ly-4,5,0,6.2832);g.fillStyle=t.color;g.fill();
      g.fillStyle='#cdd9e3';g.font=P(tall?13:11.5)+'px sans-serif';
      const txt=Math.round(t.speed)+'档 '+t.t_s.toFixed(0)+'s·'+(t.frac*100).toFixed(0)+'%';
      g.fillText(txt,lx+13,ly);lx+=13+g.measureText(txt).width+16;});
    // 停留点清单: 序号 ◆ 名称 停留时长 相位mm —— 一行横排, 永远不裁不压
    if(SEC.stops&&SEC.stops.length){
      let dy=h-46, dsz=5.2;
      g.font='600 '+P(tall?12.5:11)+'px sans-serif';
      g.fillStyle='#9fb3c4';g.fillText('停留点', 8, dy);
      let sx=8+g.measureText('停留点').width+P(10);
      SEC.stops.forEach((sp,k)=>{
        const col=(sp.kind==='grip')?'#ffd166':'#9fe8ff';
        const txt=(k+1)+' '+sp.name+(sp.hold_ms?(' '+(sp.hold_ms/1000).toFixed(1)+'s'):'');
        g.font=P(tall?12.5:11)+'px sans-serif';
        const itemW=dsz*2.4+g.measureText(txt).width+P(14);
        if(sx+itemW>w-8){sx=8; dy+=P(tall?19:17);}     // 一行放不下就换行, 绝不裁字
        g.save();g.translate(sx+dsz, dy-4);g.rotate(Math.PI/4);
        g.fillStyle=col;g.fillRect(-dsz*0.74,-dsz*0.74,dsz*1.48,dsz*1.48);
        g.strokeStyle='#08111a';g.lineWidth=1;g.strokeRect(-dsz*0.74,-dsz*0.74,dsz*1.48,dsz*1.48);g.restore();
        g.fillStyle=col;g.fillText(txt, sx+dsz*2.4, dy);
        sx+=itemW;
      });
    }
  }
  // ◆ 现在这一拍的状态(取当前索引所在块)
  let nowState='';
  if(SEC&&SEC.blocks){
    const b=SEC.blocks.find(b=>_ei>=b.i0&&_ei<=b.i1)||SEC.blocks[SEC.blocks.length-1];
    if(b){nowState=b.state;
      chip(g,8,14,'现在 '+b.state+(b.state_tags&&b.state_tags.length?' · '+b.state_tags.join(' '):''),spdc(b.speed),P(12.5));}
  }
  // ◆ 相位徽标: 大字百分比 + 文字状态(运行中/停留/已到位), 三态高亮
  try{ const _hi=(LIVE&&LIVE.nearest&&LIVE.nearest.hold_i!=null)?LIVE.nearest.hold_i:-1;
       updatePhaseBadge(_pr_pct, PH_LAST.p, PH_LAST.t? Date.now()-PH_LAST.t : 0, _hi);
       PH_LAST.p=_pr_pct; PH_LAST.t=Date.now(); }catch(e){}
  const cov=SEC&&SEC.blocks?SEC.blocks.reduce((a,b)=>a+(b.s1-b.s0),0):0;
  document.getElementById('eSub').textContent=((LIVE&&LIVE.nearest)?'● 实时 s ':'s ')+
    (s_live*100).toFixed(1)+'%'+(SEC?(' · 节拍 '+SEC.total_s.toFixed(0)+'s / '+
    ((SEC.states&&SEC.states.length)?(SEC.states.length+' 段'):(SEC.n_blocks+' 块'))+
    ' · 覆盖 '+(cov*100).toFixed(0)+'%'+(nowState?' · '+nowState:'')):'');
}

// 相位徽标: pct=0~100, prevPct/ dtMs 用来判"在走还是在停"
const PH_HIST=[];                        // [时间, 相位%] 历史, 用 ≥0.9s 的窗口算速度
let PH_HOLD_N=0, PH_CLS='run';           // "停留"要连判两个窗口才算(否则 1s 轮询撞上同一帧会闪一下琥珀)
function updatePhaseBadge(pct, prevPct, dtMs, holdI){
  const p=Math.max(0,Math.min(100, Number(pct)||0));
  const now=Date.now();
  PH_HIST.push([now,p]);
  while(PH_HIST.length>2 && now-PH_HIST[0][0]>3000) PH_HIST.shift();
  // 🔴 不能用"逐帧差分": 页面每帧都重绘(dt≈16ms) ⇒ Δp≈0 ⇒ 永远判成"停留"
  let ref=null;
  for(let i=PH_HIST.length-1;i>=0;i--){ if(now-PH_HIST[i][0]>=900){ ref=PH_HIST[i]; break; } }
  const v = ref ? (p-ref[1])/((now-ref[0])/1000) : 0;                // %/s, 0.9s 窗口
  let cls = p>=99.95 ? 'done' : (!ref ? 'run' : (Math.abs(v)<0.02 ? 'hold' : 'run'));
  if(holdI!=null && holdI>=0) cls='hold';          // 执行器正在停留点驻足(帧号来自 meas 的 hi)
  if(cls==='hold'){ PH_HOLD_N++; if(PH_HOLD_N<2) cls=PH_CLS; }   // 迟滞: 单次未动不算停留
  else PH_HOLD_N=0;
  PH_CLS=cls;
  let txt = cls==='done' ? '已到位 100%' : (cls==='hold' ? '停留中' : '运行中');
  if(holdI!=null && holdI>=0) txt='停留 · 帧#'+holdI;
  const bd=document.getElementById('phBadge'), pc=document.getElementById('phPct'),
        st=document.getElementById('phState'), bar=document.getElementById('phBar');
  if(!bd) return cls;
  if(bd.className!=='ph-badge '+cls) bd.className='ph-badge '+cls;
  pc.textContent=p.toFixed(1)+'%'; st.textContent=txt;
  bar.style.width=p+'%';
  return cls;
}
window.__phBadge=updatePhaseBadge;   // 自检/外部联动用

// ── 停点清单(DOM): 状态文字 + 输入框改名字 + ✕ 删点 ─────────────────────────
let _STOPS_KEY="";
function _stopColor(st){
  const m={'初始点':'#8f7bff','转移':'#4ea3ff','下降':'#ff9f43','抓取点':'#56d9a6','上升':'#b18cff',
    '扫码点':'#00e0c6','对位点':'#ffd166','对位':'#ffb84d','力控搜索':'#c792ea','插入':'#ff7b72',
    '设备工作点':'#ff5f6d','离开':'#8fa3b3','拔出点':'#ffab5e','废料点':'#e05a5a','过渡点':'#9aa7b4',
    '下探':'#7cc7ff','操作区':'#ff6b8a','金手指 AOI':'#d76bd0'};
  for(const k in m){ if((st||"").indexOf(k)===0) return m[k]; }
  return '#4ea3ff';
}
async function stopPost(body){
  const r=await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  _STOPS_KEY="";                         // 强制下一帧重建
  if(j&&j.ok&&LIVE) LIVE.sectors.stops=j.stops;
  return j;
}
function renderStates(SEC, s_live){
  const box=document.getElementById('stopList'); if(!box) return;
  const st=(SEC&&SEC.states)||[];
  if(!st.length) return renderStops(SEC, s_live);
  // 🔴 高亮跟**当前帧**(滑杆拖到哪/真机跟到哪, idx 已经是这个值), 不能再读 LIVE.nearest
  //    —— 那个是"真机现在在哪", 拖滑杆时它不动, 会一直停在第一行(实测就是这么卡住的)。
  let cur_i=(typeof idx==='number')?idx
              :((LIVE&&LIVE.nearest&&LIVE.nearest.i!=null)?LIVE.nearest.i:-1);
  /* 🔴 上游投影不可信时**不要换行**: 实测臂在插到底位(818,227,190)却被指到 i=62(距 574m),
     页面就从"插入到底"跳到"移动→金手指检测1"。距离 >60mm 一律视为无效, 保持原高亮。 */
  const _bad=(!(typeof idx==='number') && LIVE && LIVE.nearest &&
              LIVE.nearest.dist_mm!=null && LIVE.nearest.dist_mm>60);
  if(_bad) cur_i=-1;
  // 高亮 = 当前帧所在的那一段(单调从上往下, 不会来回跳)
  /* 高亮换行必须**稳 250ms 才算数** ——
     真机在位姿抖动/边界帧(如 #133↔#134)会被反复跨过, 一跨就换行就会"先跳到退出又跳回",
     老倪 2026-11-21 原话:「你先跳到退出, 又跳回, 不对, 顺序错了」。
     单点状态(抓取 #32 / 扫码 #64)宽度只有 1 帧, 用固定死区会让它永远点不亮 ⇒ 用时间判据。 */
  let hi=-1;
  st.forEach((o,k)=>{ if(cur_i>=o.i0 && cur_i<=o.i1) hi=k; });
  if(hi<0 && cur_i>=0) hi=(cur_i<st[0].i0)?0:st.length-1;
  if(hi<0 && window.__ST_HI!=null) hi=window.__ST_HI;   // 投影无效(_bad) ⇒ 原地不动
  const _now=Date.now();
  const _scrubbing=(_now-(_scrubT||0) < 800);   // 人拖滑杆/点行 ⇒ 立刻跟(不要迟滞)
  /* 🔴 老倪 11-22 第二次强调「高亮框别乱跳」: 之前留了"回到段首就重置"的口子 ——
     真机在初始位/段首附近时最近点会反复落回第 0 段, 一落就重置 ⇒ 高亮从中间跳回第一行。
     现在**只有人工操作(拖滑杆/点行)才允许回退**, 其余一律单调向下; 换圈也靠人点一下行。 */
  /* 回 0: 真机**停在轨迹首帧**(投影 i=0 且连续 1.5s) ⇒ 视为新一圈, 允许高亮与相位归零。
     不能只要"最近点是第 0 段"就重置 —— 那会在段首附近来回抖动(之前跳到第 1 行就是这个)。
     老倪 11-22: 「回 0」「相位没有回 0」。 */
  const _nowMs=Date.now();
  if(!_bad && cur_i===0){ if(!window.__ST_Z0) window.__ST_Z0=_nowMs; } else { window.__ST_Z0=0; }
  const _atZero=(window.__ST_Z0 && (_nowMs-window.__ST_Z0)>1500);
  if(_atZero){ window.__ST_MAX=0; }
  if(_scrubbing || _atZero || window.__ST_HI==null){
    window.__ST_HI=hi; window.__ST_CAND=hi; window.__ST_T=_now; window.__ST_MAX=hi;
  }else if(hi===window.__ST_HI){
    window.__ST_CAND=hi; window.__ST_T=_now;                    // 没变 ⇒ 计时复位
  }else{
    if(window.__ST_CAND!==hi){ window.__ST_CAND=hi; window.__ST_T=_now; }
    let _h=hi;
    if(_now-(window.__ST_T||0) < 250){ _h=window.__ST_HI; }     // 没稳 250ms ⇒ 先不换行
    /* 🔴 单调锁(老倪 11-22:「高亮的方块顺序不要乱跳, 按从上到下的顺序来」):
       真机最近点会因演示轨迹自交(回程穿过抓取走廊)跳回前面的行 —— 稳定性判据挡不住,
       所以这里对"已到达的行号"取 max: 除人工拖动/点行/回到段首, 高亮只增不减。 */
    /* 追赶: 人工快速拖动时投影会一次跨好几行, 若还是"每拍只 +1 行"页面就明显跟不上。
       投影可信(dist<25mm)且跨行 >3 时直接跳到 cur_i —— 仍然是**只向前**, 不回退。 */
    if(!_bad && (typeof cur_i==='number') && cur_i>_h+3 &&
       (LIVE.nearest&&LIVE.nearest.dist_mm!=null&&LIVE.nearest.dist_mm<25)){ _h=cur_i; }
    _h=Math.max(_h, window.__ST_MAX==null?0:window.__ST_MAX);
    /* 🔴 每次刷新最多往下走 1 行(老倪:"怎么突然跳到 11 了" / "别乱跳") ——
       真值最近点在自交/往返处会一次跳好几个段, 那样看着就是"跳"。限速成逐行推进,
       一段一段往下扫, 哪怕上游给的索引突变也只一行一行走。 */
    const _cap=(window.__ST_HI==null?0:window.__ST_HI)+1;
    if(_h>_cap){ _h=_cap; }
    window.__ST_HI=_h; window.__ST_MAX=_h; hi=_h;
  }
  if(hi<0) hi=0;
  if(!st.length) return;   // 空段表不渲染, 保留上一帧的行, 避免"整列消失"
  // 越界钳制: 段数变化(删重复段)后旧索引可能超出列表 ⇒ 高亮跑到最下面甚至消失(老倪实测)
  if(st.length && hi>st.length-1) hi=st.length-1;   // 兜底: 投影无效又还没有历史高亮时, 至少停在第一行(不留"没有高亮"的空态)
  const key=st.map(o=>o.i0+':'+o.i1+':'+o.name).join('|')+'#'+hi;
  if(key===window.__ST_KEY) return;
  window.__ST_KEY=key;
  const frag=document.createDocumentFragment();
  const hd=document.createElement('div'); hd.className='hd2';
  hd.innerHTML='<span>状态 '+st.length+' 个（239 点 · 点一行跳到该段起点）</span><span>'+
               (SEC&&SEC.total_s?Math.round(SEC.total_s)+'s':'')+'</span>';
  frag.appendChild(hd);
  st.forEach((o,k)=>{
    const row=document.createElement('div');
    row.className='r'+(k===hi?' cur':'');
    row.style.borderLeftColor=o.color||'#3ddc84';
    row.style.cursor='pointer';
    row.title=o.name+'  #'+o.i0+'→#'+o.i1+'  '+(o.t_s||0).toFixed(1)+'s  '+(o.s_mm||0)+'mm';
    const no=document.createElement('span'); no.className='i'; no.textContent=(k+1)+' #'+o.i0;
    const nm=document.createElement('span'); nm.style.flex='1'; nm.style.fontWeight=(k===hi?'700':'400');
    nm.textContent=o.name;
    const tm=document.createElement('span'); tm.style.cssText='color:#7c93a8;font-size:11px;min-width:44px;text-align:right';
    tm.textContent=Math.round(o.t_s||0)+'s';
    row.append(no,nm,tm);
    row.addEventListener('click',()=>{ idx=Math.max(0,Math.min(N-1,o.i0)); _scrubT=Date.now();
      const sc=document.getElementById('sc'); if(sc) sc.value=idx; drawAll(); });
    frag.appendChild(row);
  });
  box.replaceChildren(frag);
  const cur=box.querySelector('.r.cur');
  if(cur){
    const br=box.getBoundingClientRect(), cr=cur.getBoundingClientRect();
    if(cr.top<br.top+4) box.scrollTop-=(br.top+4-cr.top);
    else if(cr.bottom>br.bottom-4) box.scrollTop+=(cr.bottom-br.bottom+4);
  }
}
function renderStops(SEC, s_live){
  const box=document.getElementById('stopList'); if(!box) return;
  const st=(SEC&&SEC.stops)||[];
  // 🔴 高亮跟**当前帧**(滑杆拖到哪/真机跟到哪, idx 已经是这个值), 不能再读 LIVE.nearest
  //    —— 那个是"真机现在在哪", 拖滑杆时它不动, 会一直停在第一行(实测就是这么卡住的)。
  const cur_i=(typeof idx==='number')?idx
              :((LIVE&&LIVE.nearest&&LIVE.nearest.i!=null)?LIVE.nearest.i:-1);
  // 🔴 高亮 = **正在走的那一段的落点状态**(第一个 i>=当前帧 的停点), 不是"最近的距离",
  //    也不是"已走过的最下面" —— 后两者与画布上那句"现在 <状态>"会打架。
  //    行 i 覆盖 (上一个停点, 本停点], 所以当前帧落在哪一行, 就是第一个 i>=当前帧 的行。
  //    单调递增 ⇒ 方框只会从上往下走, 不会来回跳。
  let hi=-1;
  st.forEach((o,k)=>{ if(hi<0 && cur_i>=0 && o.i>=cur_i) hi=k; });
  if(hi<0 && cur_i>=0 && st.length) hi=st.length-1;      // 过了最后一个停点(#237) ⇒ 停在最后一行
  // 只有"停点集合变了"或"当前行变了"才重建, 否则正在输入的内容会被打断
  const key=st.map(o=>o.i+':'+(o.label||'')).join('|')+'#'+hi;
  if(key===_STOPS_KEY) return;
  _STOPS_KEY=key;
  const frag=document.createDocumentFragment();
  const hd=document.createElement('div'); hd.className='hd2';
  const _v2=(LIVE&&LIVE.set==='v2');
  hd.innerHTML='<span>'+( _v2 ? ('状态 '+st.length+' 个（走到该点停 1 秒）') : ('停点 '+st.length+' 个（方向突变 → 停 1 秒）') )+'</span><span>点 ✕ 删</span>';
  frag.appendChild(hd);
  st.forEach((o,k)=>{
    const row=document.createElement('div');
    row.className='r'+(k===hi?' cur':'');
    row.style.borderLeftColor=_stopColor(o.label||o.name||'');
    const idx=document.createElement('span'); idx.className='i'; idx.textContent='#'+o.i;
    const inp=document.createElement('input'); inp.value=(o.label&&o.label[0]==='#'?'':o.label)||'';
    inp.placeholder='输入名称…'; inp.dataset.i=o.i;
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') inp.blur(); });
    inp.addEventListener('change',async()=>{ await stopPost({i:o.i, name:inp.value}); });
    const del=document.createElement('button'); del.textContent='✕'; del.title='删除这个停点';
    del.addEventListener('click',async()=>{ await stopPost({i:o.i, del:true}); });
    row.append(idx,inp,del); frag.appendChild(row);
  });
  box.replaceChildren(frag);
  // 高亮行始终可见(列表比卡片高时要跟着往下滚, 不然高亮跑到可视区外就"看不到变化")
  const cur=box.querySelector('.r.cur');
  if(cur){
    const br=box.getBoundingClientRect(), cr=cur.getBoundingClientRect();
    if(cr.top<br.top+4) box.scrollTop-= (br.top+4-cr.top);
    else if(cr.bottom>br.bottom-4) box.scrollTop+= (cr.bottom-br.bottom+4);
  }
}
