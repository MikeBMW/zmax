# 装法: sudo mkdir -p /etc/systemd/system/zmax-traj-ar.service.d
#       sudo cp tools/systemd/zmax-traj-ar-killmode.conf /etc/systemd/system/zmax-traj-ar.service.d/killmode.conf
#       sudo systemctl daemon-reload && sudo systemctl restart zmax-traj-ar.service
#
# 为什么: 「同步操作」的真机逐点走是 8797 服务拉起的 docker 子进程。
# 默认 KillMode=control-group 会把整条 cgroup 一起 SIGTERM —— 2026-11-13 实测:
# restart 8797 时把正在走第 3 点的真机任务打断了(日志 "got 3 SIGTERM/SIGINTs, forcefully exiting")。
# 真机任务必须能自己收尾(走到当前点后停在 idle), 所以只杀主进程。
[Service]
KillMode=process
