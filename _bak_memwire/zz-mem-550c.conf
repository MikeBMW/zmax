[Service]
# 2026-10-30 记忆层实接入 (L2 肌肉 → L3 流程工艺 → L4 安全), 550C 部署
#   白名单 = ssplan + 三个记忆节点 (不引入 ssyolo/ssdec/流形节点, 保持 550C 现有回路结构)
#   ⛔ 全程不驱动机器人: 本回路只出 ar_cmd.json (数据面), 550C 无 ar_cmd 执行消费者
Environment=ZMAX_CANVAS_ONLY=ssplan,ss_mem_l2,ss_mem_l3,ss_mem_l4
Environment=ZMAX_PLAN_MEM=1
Environment=ZMAX_UPH_TACT_TARGET=11.7
# 跨件过渡: 段表 10 处换位缺口合计 14.9m/圈, 不补时间就是单帧瞬移 (假节拍)
#   1800mm/s 声明口径 ⇒ 每圈 +8.3s ⇒ 302.7UPH; 700mm/s(保守) ⇒ +21.3s ⇒ 279UPH
#   ⚠ 将来接真机执行必须按机器实测重设此值
Environment=ZMAX_MEM_TRAVEL=1
Environment=ZMAX_MEM_TRAVEL_MM_S=1800
