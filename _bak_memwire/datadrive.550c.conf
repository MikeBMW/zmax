server
{
    listen 8081;
    server_name datadrive.world;


    # ===== 3D 应用专属路径：放开 IP（改由设备鉴权 device 参数控制）2026-09-25 =====
    # === zmax mobile map BEGIN ===
    # 手机拍视频建图 (Intel:8803 经 SSH 隧道)
    location = /map { return 301 /map/; }
    # Three.js 走 ECS 本地文件 —— 1.27MB 经隧道会 25s 超时, 页面 import 失败
    location ^~ /map/lib/ {
        alias /home/intel/zmax_web/map_lib/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        gzip on;
        gzip_types application/javascript text/javascript;
    }
    location ^~ /map/ {
        proxy_pass http://127.0.0.1:18794/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 800m;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
    # === zmax mobile map END ===

    # ===== IP 识别页（白名单登记用，永远公开）&mdash;&mdash; 2026-10-25 =====
    location = /ip.html { allow all; expires -1; try_files $uri =404; }
    location = /api/whoami {
        allow all;
        default_type application/json;
        add_header Cache-Control "no-store";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index whoami.php;
        fastcgi_param SCRIPT_FILENAME /home/intel/zmax_web/whoami.php;
        include fastcgi_params;
    }
    location = /state-3d.html { allow all; expires -1; try_files $uri =404; }
    location = /device-bind.php { allow all; try_files $uri =404; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_index index.php; include fastcgi.conf; include pathinfo.conf; }
    location = /ss3d_cmd.php { allow all; try_files $uri =404; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_index index.php; include fastcgi.conf; include pathinfo.conf; }
    location = /state-service-api.php { allow all; try_files $uri =404; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_index index.php; include fastcgi.conf; include pathinfo.conf; }
    location = /ss3d_live.json { allow all; default_type application/json; try_files $uri =404; }
    location = /ss_traj_full.json { allow all; default_type application/json; try_files $uri =404; }
    location = /factory-3d.html { allow all; expires -1; try_files $uri =404; }
    location = /simulink.html { allow all; expires -1; try_files $uri =404; }
    location = /zmax-auth.js { allow all; try_files $uri =404; }
    location = /zmax-pipe.js { allow all; try_files $uri =404; }
    location ^~ /lib/three/ { allow all; }
    location = /three.min.js { allow all; }
    # ===== 3D 应用专属路径 END =====
    location = /Z-MAX.apk { allow all; default_type application/vnd.android.package-archive; add_header Content-Disposition "attachment; filename=Z-MAX.apk"; }
    location = /Z-MAX-3D.apk { allow all; default_type application/vnd.android.package-archive; add_header Content-Disposition "attachment; filename=Z-MAX-3D.apk"; }
    location = /Z-MAX-Cams.apk { allow all; default_type application/vnd.android.package-archive; add_header Content-Disposition "attachment; filename=Z-MAX-Cams.apk"; }



    index index.html index.php index.html index.htm default.php default.htm default.html;
    root /home/intel/zmax_web;
    
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    location ^~ /.well-known/ { allow all; root /home/intel/zmax_web; }
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    location ~ [^/]\.php(/|$)
    {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    #PHP-INFO-END

    # Z-MAX page redirect
    location /z-max { return 302 /index.php/z-max/; }


    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    # Z-MAX models 静态服务 (2026-08-06: 大文件绕过 PHP 截断)
    location ^~ /models/ {
        root /home/intel/zmax_web;
        default_type application/octet-stream;
        add_header Cache-Control no-cache;
        log_not_found off;   # 模型大文件在4090机，缺失时不刷error.log
    }
    # 站内资源是绝对路径(/aoi_gold.mjpg /snapshot/...), 故一并反代, 否则页面能开但图全裂

    location = / { try_files /index.html =404; }

# <<< zmax-frp-ws (auto) <<<

    
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ^~ /api/relay/cam/ {
        proxy_pass http://127.0.0.1:39053/cam/;
        proxy_read_timeout 60s; }
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location = /auth.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location ~ .*\.(js|css)?$
    {
        allow all;   # auth.js 密码门脚本，不限 IP
        expires      -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(html|htm)?$
    {
        allow all;   # App 页面走密码门，不限 IP
        expires      -1;
        error_log /dev/null;
        access_log /dev/null;
    }
    # ===== B站内网转发代理 (2026-09-26) =====
    # 公司内网无法访问 bilibili，经本机 39063 转发 API/图片/视频流
    location ^~ /api/bili/ {
        allow all;
        proxy_pass http://127.0.0.1:39063/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ^~ /stream {
        allow all;
        proxy_pass http://127.0.0.1:39063/stream;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 300s;
        # 视频流必须关闭缓冲：否则 nginx 会先把整段拉完才发给浏览器，
        # 长视频（80MB）会造成「等十几秒才出画面」。流式必须边拉边发。
        proxy_buffering off;
        # 【2026-09-27 修复】原 proxy_http_version 1.1 但未清空 Connection，
        # 默认头 "Connection: close" 会被透传给本地上游 → 上游 python 关闭连接、
        # nginx 每次都新建上游 TCP，每 1MB 分片都要重新握手。
        # 实测 300KB/s（1MB/8s），一个 71 分钟视频根本追不上播放速度。
        # Connection "" 让 nginx 与上游保持长连接复用。
        # （历史教训里说的 Connection "close" 拖慢，指的是让 nginx 主动关上游连接，
        #  与此处清空是相反方向，勿混淆）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 【2026-09-27 修复】上游 m4s 流写满 proxy_temp 后 nginx 会先落盘再发送，
        # 默认 proxy_max_temp_file_size 10GB 等于「整段视频先缓存到磁盘」，
        # Range=0-16MB 只能取到 12MB 就卡死超时 → 置 0 禁用磁盘缓冲。
        # 注意：置 0 后 Content-Length 仍由上游提供（实测 Content-Range 完整），
        # 不能改成其他值，否则会退回「整段落盘」的老问题。
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
        # 【2026-09-27】m4s 的 moov 只有 904B 且在文件最前（offset 32），
        # 浏览器本可秒解析。但实测冷启动要 24~28s，因为 m4s 无 Content-Type、
        # Chrome 需预读约 10MB 才触发 canplay，而链路仅 ~400KB/s。
        # 这里加大读缓冲块争取吞吐（真正的提速在上游侧，见 bili_proxy.py）。
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
    location ^~ /merge {
        allow all;
        proxy_pass http://127.0.0.1:39063/merge;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }
    location = /bili.html {
        allow all;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }
    location = /bili-learn.html {
        allow all;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }
    # ===== B站转发 END =====

    access_log  /www/wwwlogs/datadrive.world.log;
    location /ws/dds/ { proxy_pass http://127.0.0.1:39062/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location /ws/bus/ { proxy_pass http://127.0.0.1:39064/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
    location /ws/orin { proxy_pass http://127.0.0.1:39053/ws/orin; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location /orin/ { proxy_pass http://127.0.0.1:39053/orin/; }
    error_log  /www/wwwlogs/datadrive.world.error.log;
    location = /robot2.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /api/train/ {
        allow all;   # 训练控制 API，手机密码门后可用
        proxy_pass http://127.0.0.1:39061;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /api/comfy/ {
        # 迁移后统一走 zmax-relay (39053)，原旧机 50058 的 comfy 服务未迁移
        client_max_body_size 500m; proxy_pass http://127.0.0.1:39053/; }
    location /api/snapshot/ { proxy_pass http://127.0.0.1:39053/api/snapshot/; proxy_read_timeout 60s; }
    location /api/relay/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:39053/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s; }
    location /api/orin/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:39053/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s; }

location = /neuromorphic.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # 🎥 现场相机实时中继 (2026-09-27 小芳) — 手机/公网直看现场画面
    #   后端 /root/cam_relay.py 监听 127.0.0.1:8901; 现场脚本 POST /api/cam/<id>
    location = /live.html { allow all; proxy_pass http://127.0.0.1:8901/live.html; }
    location = /live.json { allow all; proxy_pass http://127.0.0.1:8901/live.json; }
    location ^~ /live/ {
        allow all;
        proxy_pass http://127.0.0.1:8901/live/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store";
        add_header X-Accel-Buffering "no";
    }
    location ^~ /api/cam/ { allow all; proxy_pass http://127.0.0.1:8901/api/cam/; client_max_body_size 8m; }
# >>> zmax-station-forward (auto) >>>
  location ^~ /st/ {               # ^~ 必须: 否则被宝塔的 .jpg/.png 正则 location 抢走(图片路径 404)
      proxy_pass http://127.0.0.1:18793/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_buffering off;          # MJPEG 必须关, 否则画面卡成一帧
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding off;
  }
# <<< zmax-station-forward (auto) <<<
# >>> zmax-overlay-forward (auto) >>>
  location ^~ /ov/ {               # ^~ 必须: 否则被宝塔的 .jpg/.png 正则 location 抢走(图片路径 404)
      proxy_pass http://127.0.0.1:18791/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_buffering off;          # MJPEG 必须关, 否则画面卡成一帧
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding off;
  }
# <<< zmax-overlay-forward (auto) <<<

# >>> zmax-dash-forward (auto) >>>  产品大屏单一数据源 8799 → 18799 (ssh -R)
  location ^~ /dash/ {
      proxy_pass http://127.0.0.1:18799/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_read_timeout 120s;
  }
# <<< zmax-dash-forward (auto) <<<
}

