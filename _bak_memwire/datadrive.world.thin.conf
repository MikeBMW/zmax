server
{
    listen 80;
    listen 443 ssl http2;
    server_name datadrive.world;

    # ===== 2026-10-30 迁移: 站点与全部服务已搬到 550C(192.168.23.70) =====
    # 本机只做三件事: ① TLS 终结 + 证书续期 ② /models/ 大文件暂留本地 ③ 反代到 SSH 反向隧道 127.0.0.1:18790 → 550C:8081
    # 回滚: cp /etc/nginx/sites-available/datadrive.world.conf.20261030.bak /etc/nginx/sites-available/datadrive.world.conf && nginx -s reload

    # 证书申请验证 (acme) 必须留本地
    location ^~ /.well-known/ { allow all; root /www/wwwroot/datadrive.world; }

    # 大模型文件暂留云端 (2.0G, 移到 550C 需 ~4h; 移完删掉本段即可)
    location ^~ /models/ {
        root /www/wwwroot/datadrive.world;
        default_type application/octet-stream;
        add_header Cache-Control no-cache;
        log_not_found off;
    }

    # frp 控制连接 (走 443, 阿里云安全组只开 22/80/443)
    location ^~ /zmax-tunnel {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 其余全部交给 550C
    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 800m;
        proxy_request_buffering off;
        proxy_buffering off;              # mjpg 流 (/aoi_gold.mjpg /stream) 必须不缓冲
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    ssl_certificate /www/server/panel/vhost/cert/datadrive.world/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/datadrive.world/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
