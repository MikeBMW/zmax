// ── 通用: 3D→2D 正交投影
function proj(cv,p,yaw,pitch,scale,cx,cy){
  const cy_=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  let x=p[0]*cy_ - p[1]*sy, y=p[0]*sy + p[1]*cy_, z=p[2];

  return [cx + x*scale, cy - z2*scale, y2];        // 返回屏坐标 + 深度
}
function clear(cv,bg){const g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);

function fit(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;

function line(g,a,b,c,w){g.strokeStyle=c;g.lineWidth=w||1;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}

function drawA(){

  const ps=F.map(f=>f.p), cen=[0,1,2].map(k=>ps.reduce((s,p)=>s+p[k],0)/N);

  // 参考轴(插入段 +X) 与当前轴
  const ref=F[30].n, o=proj(cv,[0,0,0],yaw,0.35,s,cx,cy), rp=proj(cv,ref,yaw,0.35,s,cx,cy);
  line(g,o,rp,'#3ddc84',2);g.fillStyle='#3ddc84';g.font='11px sans-serif';g.fillText('孔轴/参考',rp[0]+5,rp[1]);
  const cp=proj(cv,F[idx].n,yaw,0.35,s,cx,cy);
  line(g,o,cp,'#37d0ff',2.4);circle(g,cp[0],cp[1],4,'#37d0ff',0,'#37d0ff');
  const dot=F[idx].n[0]*ref[0]+F[idx].n[1]*ref[1]+F[idx].n[2]*ref[2];
  const err=Math.acos(Math.max(-1,Math.min(1,dot)))*180/Math.PI;
  document.getElementById('bSub').textContent='轴误差 '+err.toFixed(2)+'°';
}

// ── C: 四元数球 (轴角球: 点 = 虚部, 半径 = sin(θ/2))
function drawC(){
  const cv=document.getElementById('c'),{g,w,h}=fit(cv);clear(cv);
  const s=Math.min(w,h)*0.40, cx=w/2, cy=h/2;
  circle(g,cx,cy,s,'#2c3e4d',1.2);
  circle(g,cx,cy,s*0.5,'#1e2a33',1);
  line(g,[cx-s,cy],[cx+s,cy],'#1e2a33',1);line(g,[cx,cy-s],[cx,cy+s],'#1e2a33',1);
  // 215 个点: (x,y,z) 虚部, 深度用 z
  for(let i=0;i<N;i++){
    const q=F[i].q, v=[q[1],q[2],q[3]];
    const p=proj(cv,v,performance.now()/5000,0.3,s,cx,cy);
    g.globalAlpha=(i<=idx)?.95:.25;
    g.fillStyle=showPhase?hsl(i,N):'#4a6b80';
    g.beginPath();g.arc(p[0],p[1],(i===idx)?3.6:1.5,0,6.28);g.fill();
  }
  g.globalAlpha=1;
  const q=F[idx].q,v=[q[1],q[2],q[3]];
  const p=proj(cv,v,performance.now()/5000,0.3,s,cx,cy);
  circle(g,p[0],p[1],5,'#fff',1.6);
  const th=2*Math.acos(Math.min(1,Math.abs(q[0])))*180/Math.PI;
  document.getElementById('cSub').textContent='|v|=sin(θ/2)='+Math.hypot(v[0],v[1],v[2]).toFixed(3)+' · θ='+th.toFixed(1)+'°';
}

// ── D: 滚转 S¹
function drawD(){
  const cv=document.getElementById('d'),{g,w,h}=fit(cv);clear(cv);
  const R=Math.min(h*0.34,70), cx=R+18, cy=h/2;
  circle(g,cx,cy,R,'#2c3e4d',1.4);
  for(let k=0;k<12;k++){const a=k*Math.PI/6;
    const r1=R-6,r2=R;
    line(g,[cx+Math.cos(a)*r1,cy-Math.sin(a)*r1],[cx+Math.cos(a)*r2,cy-Math.sin(a)*r2],'#3a4d5e',1);}
  // 历史弧: φ 从 0 到当前
  const phi=F[idx].phi*Math.PI/180;
  g.beginPath();g.strokeStyle='#37d0ff';g.lineWidth=2.4;
  g.arc(cx,cy,R*0.72,-phi,0,false);g.stroke();
  line(g,[cx,cy],[cx+Math.cos(phi)*R*0.94,cy-Math.sin(phi)*R*0.94],'#fff',2);
  circle(g,cx,cy,3,'#fff',0,'#fff');
  g.fillStyle='#d8e2ea';g.font='600 12px sans-serif';
  g.fillText('φ '+F[idx].phi.toFixed(1)+'°',cx+R+16,cy-8);
  g.fillStyle='#7b8b99';g.font='11px sans-serif';
  g.fillText('绕轴滚转',cx+R+16,cy+10);g.fillText('Δφ '+F[idx].dphi.toFixed(2)+'°/帧',cx+R+16,cy+28);
  document.getElementById('dSub').textContent='φ='+F[idx].phi.toFixed(1)+'°';
}

// ── E: 相位 S¹
function drawE(){
  const cv=document.getElementById('e'),{g,w,h}=fit(cv);clear(cv);
  const R=Math.min(h*0.36,76), cx=R+18, cy=h/2, s=idx/ (N-1);
  circle(g,cx,cy,R,'#2c3e4d',1.4);
  // 215 个刻度
  for(let i=0;i<N;i+=3){const a=(i/(N-1))*6.2832-Math.PI/2;
    const r1=R-4,r2=R+(i===idx?2:0);
    line(g,[cx+Math.cos(a)*r1,cy+Math.sin(a)*r1],[cx+Math.cos(a)*r2,cy+Math.sin(a)*r2],
      (i<=idx)?'#37d0ff':'#2c3e4d',(i===idx)?2.2:1);}
  const a=s*6.2832-Math.PI/2;
  circle(g,cx+Math.cos(a)*R,cy+Math.sin(a)*R,4.5,'#fff',1.5,'#0e141a');
  g.strokeStyle='#fff';g.lineWidth=1.6;g.beginPath();g.moveTo(cx,cy);
  g.lineTo(cx+Math.cos(a)*R*0.8,cy+Math.sin(a)*R*0.8);g.stroke();
  g.fillStyle='#d8e2ea';g.font='600 12px sans-serif';
  g.fillText('#'+idx+' / '+(N-1),cx+R+16,cy-10);
  g.fillStyle='#7b8b99';g.font='11px sans-serif';
  g.fillText('s = '+(s*100).toFixed(1)+'%',cx+R+16,cy+8);
  g.fillText('指令速度 '+F[idx].spd.toFixed(0),cx+R+16,cy+26);
  document.getElementById('eSub').textContent=(s*100).toFixed(0)+'% · '+F[idx].spd.toFixed(0);
}
function drawAll(){drawA();drawB();drawC();drawD();drawE();
  document.getElementById('idx').textContent='#'+idx;}
// 交互
document.getElementById('sc').addEventListener('input',e=>{idx=+e.target.value;drawAll();});
document.getElementById('play').addEventListener('click',e=>{playing=!playing;
  e.target.classList.toggle('on',playing);e.target.textContent=playing?'⏸ 暂停':'▶ 播放';});
document.getElementById('tPhase').addEventListener('click',e=>{showPhase=!showPhase;e.target.classList.toggle('on',showPhase);drawAll();});
document.getElementById('tSpd').addEventListener('click',e=>{showSpd=!showSpd;e.target.classList.toggle('on',showSpd);drawAll();});
setInterval(()=>{
  if(playing){idx=(idx+1)%N;document.getElementById('sc').value=idx;}
  drawAll();
},120);
drawAll();
window.selftest=()=>({n:N, idx, bbox:['X636','Y922','Z884'], axisErr:+(Math.acos(Math.max(-1,Math.min(1,
  F[idx].n[0]*F[30].n[0]+F[idx].n[1]*F[30].n[1]+F[idx].n[2]*F[30].n[2])))*180/Math.PI).toFixed(2),
  spdTiers:Object.keys(SPC).map(Number), quatNorm:+(Math.hypot(...F[idx].q)).toFixed(4)});
</script></body></html>
