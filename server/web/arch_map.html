<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z-MAX 系统架构 · 系统2/1/0 × L1~L5 全节点映射</title>
<style>
:root{
  --bg:#0b0f16; --bg2:#111721; --card:#161d2a; --bord:#243044;
  --txt:#e6edf7; --dim:#8b9ab0; --gray:#5f6d82;
  --s2:#a855f7; --s1:#22d3ee; --s0:#f59e0b;
  --l5:#a855f7; --l4:#f472b6; --l3:#22d3ee; --l2:#34d399; --l1:#f59e0b; --met:#64748b;
  --ok:#22c55e; --no:#ef4444;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--txt);
  font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  overflow:hidden; height:100vh}
#head{height:56px; display:flex; align-items:center; gap:14px; padding:0 18px;
  background:linear-gradient(180deg,#131a26,#0e131c); border-bottom:1px solid var(--bord); position:relative; z-index:20}
#head h1{font-size:15px; font-weight:700; letter-spacing:.3px; white-space:nowrap; flex-shrink:0}
#head .ver{font-size:11px; color:var(--dim); background:var(--card);
  border:1px solid var(--bord); border-radius:4px; padding:2px 7px; white-space:nowrap; flex-shrink:0}
#head .stat{margin-left:auto; display:flex; gap:14px; font-size:11.5px; color:var(--dim);
  white-space:nowrap; flex-shrink:0; overflow:hidden}
#head .stat b{color:var(--txt); font-weight:600}
#head .stat span{white-space:nowrap}
#head button{background:var(--card); color:var(--txt); border:1px solid var(--bord);
  border-radius:5px; padding:5px 11px; font-size:11.5px; cursor:pointer; white-space:nowrap; flex-shrink:0}
#head button:hover{border-color:var(--s1); color:var(--s1)}
#head button.on{background:#1b2836; border-color:var(--s1); color:var(--s1)}

#wrap{position:relative; height:calc(100vh - 56px); overflow:auto}
#stage{position:relative; transform-origin:0 0}
svg#links{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1}

.sysband{position:absolute; left:0; border-radius:10px; border:1px solid;
  background:rgba(255,255,255,.012)}
.syslabel{position:absolute; left:10px; font-weight:700; font-size:13px; letter-spacing:.5px;
  writing-mode:vertical-rl; text-orientation:mixed; opacity:.85}
.layerbar{position:absolute; border-radius:7px; border:1px solid; border-left-width:3px;
  background:rgba(255,255,255,.018)}
.layerlabel{position:absolute; left:7px; top:5px; font-size:10.5px; font-weight:700;
  letter-spacing:.2px; opacity:.9; white-space:nowrap}

.node{position:absolute; border-radius:6px; background:var(--card); border:1px solid var(--bord);
  cursor:pointer; z-index:5; overflow:hidden; transition:border-color .12s, transform .12s, box-shadow .12s;
  display:flex; flex-direction:column; justify-content:center; padding:3px 6px}
.node:hover{border-color:var(--s1); transform:translateY(-1px); box-shadow:0 3px 12px rgba(34,211,238,.18); z-index:9}
.node .t{font-size:9.5px; line-height:1.22; font-weight:600; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-all}
.node .s{font-size:8.5px; color:var(--gray); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.node.hw{background:#1d1620; border-color:#5b3a4a}
.node.sysn{background:#141d2b; border-width:2px}
.node.dim{opacity:.16}

#legend{position:fixed; right:14px; bottom:14px; background:rgba(17,23,33,.95);
  border:1px solid var(--bord); border-radius:8px; padding:10px 13px; font-size:11px;
  color:var(--dim); z-index:30; line-height:1.9; backdrop-filter:blur(6px)}
#legend div{display:flex; align-items:center; gap:7px}
#legend i{width:9px; height:9px; border-radius:2px; display:inline-block}

#panel{position:fixed; right:0; top:56px; width:400px; height:calc(100vh - 56px);
  background:rgba(13,18,26,.98); border-left:1px solid var(--bord); z-index:40;
  padding:18px; overflow-y:auto; transform:translateX(100%); transition:transform .18s}
#panel.open{transform:translateX(0)}
#panel h2{font-size:14px; margin-bottom:4px; word-break:break-all}
#panel .meta{font-size:11px; color:var(--dim); margin-bottom:14px; line-height:1.8}
#panel .row{margin-bottom:11px}
#panel .k{font-size:10.5px; color:var(--gray); text-transform:uppercase; letter-spacing:.6px; margin-bottom:3px}
#panel .v{font-size:12px; word-break:break-all; background:var(--bg2); border:1px solid var(--bord);
  border-radius:4px; padding:6px 8px; font-family:ui-monospace,Consolas,monospace; font-size:11px}
#panel .close{position:absolute; right:14px; top:14px; cursor:pointer; color:var(--dim); font-size:18px}
#panel .close:hover{color:#fff}
.chip{display:inline-block; font-size:10px; padding:1.5px 7px; border-radius:9px;
  border:1px solid; margin:2px 4px 2px 0}
</style>
</head>
<body>
<div id="head">
  <h1>🏗️ Z-MAX 系统架构</h1>
  <span class="ver" id="ver">v5.50.786</span>
  <button id="btnSvc" class="on">▣ 标准服务</button>
  <button id="btnHw" class="on">▣ 硬件</button>
  <button id="btnFit">⤢ 适应窗口</button>
  <div class="stat" id="stat"></div>
</div>

<div id="wrap">
  <div id="stage">
    <svg id="links"></svg>
  </div>
</div>

<div id="legend">
  <div><i style="background:var(--s2)"></i>系统 2 · 慢思考 (L4/L5)</div>
  <div><i style="background:var(--s1)"></i>系统 1 · 快反应 (L2/L3)</div>
  <div><i style="background:var(--s0)"></i>系统 0 · 反射 (L1)</div>
  <div style="margin-top:6px; border-top:1px solid var(--bord); padding-top:6px">
    <span style="color:var(--gray)">连线 = 画布 241 条真连线</span>
  </div>
</div>

<div id="panel"><span class="close" onclick="closePanel()">✕</span><div id="pbody"></div></div>

<script>
let MAP=null, SHOW_SVC=true, SHOW_HW=true;
const LAYER_ORDER=['L5','L4','L3','L2','L1'];
const SYS_ORDER=['S2','S1','S0'];
const COLOR={S2:'#a855f7',S1:'#22d3ee',S0:'#f59e0b',
             L5:'#a855f7',L4:'#f472b6',L3:'#22d3ee',L2:'#34d399',L1:'#f59e0b',MET:'#64748b'};

const NODE_W=126, NODE_H=34, GAP_X=8, GAP_Y=7, PAD=14;
const BAND_X=96, LAYER_LABEL_W=76;

async function boot(){
  const r=await fetch('arch_map.json?'+Date.now());
  MAP=await r.json();
  document.getElementById('ver').textContent='v'+MAP.version;
  render();
  fit();
  window.addEventListener('resize',fit);
}
function closePanel(){document.getElementById('panel').classList.remove('open')}

function render(){
  const stage=document.getElementById('stage');
  stage.innerHTML='<svg id="links"></svg>';
  const svg=stage.querySelector('#links');

  // 分组: system -> layer -> nodes
  const groups={};
  MAP.nodes.forEach(n=>{
    const isHw=n.type==='hardware';
    if(isHw && !SHOW_HW) return;
    const sy=n.system||'S1';
    const lv=n.layer||'MET';
    (groups[sy]=groups[sy]||{});
    (groups[sy][lv]=groups[sy][lv]||[]).push(n);
  });

  let y=0;
  const nodePos={};
  const bands=[];

  SYS_ORDER.forEach(sy=>{
    const g=groups[sy]; if(!g) return;
    const sysMeta=MAP.systems[sy];
    const bandTop=y;
    y+=26;  // 系统标题留白

    LAYER_ORDER.forEach(lv=>{
      const list=g[lv]; if(!list||!list.length) return;
      const perRow=Math.max(4,Math.floor((1400-BAND_X-LAYER_LABEL_W)/ (NODE_W+GAP_X)));
      const rows=Math.ceil(list.length/perRow);
      const lh=rows*(NODE_H+GAP_Y)+16;
      const layerMeta=(MAP.layers[lv]||{});
      bands.push({kind:'layer', y, h:lh, layer:lv, system:sy, label:lv+' '+shortName(layerMeta.name||lv), n:list.length});
      list.forEach((n,i)=>{
        const col=i%perRow, row=Math.floor(i/perRow);
        const x=BAND_X+LAYER_LABEL_W+col*(NODE_W+GAP_X);
        const yy=y+8+row*(NODE_H+GAP_Y);
        nodePos[n.id]={x,y:yy,w:NODE_W,h:NODE_H};
        addNode(stage,n,x,yy,NODE_W,NODE_H,lv);
      });
      y+=lh+GAP_Y;
    });

    const bandH=y-bandTop;
    bands.push({kind:'system', y:bandTop, h:bandH, system:sy});
    y+=GAP_Y;
  });

  // 画系统带 / 层带
  bands.forEach(b=>{
    const d=document.createElement('div');
    if(b.kind==='system'){
      d.className='sysband';
      d.style.cssText+=`left:0; top:${b.y}px; width:${BAND_X-8}px; height:${b.h}px;
        border-color:${COLOR[b.system]}44;`;
      const lb=document.createElement('div');
      lb.className='syslabel';
      lb.style.cssText=`top:${b.y+12}px; color:${COLOR[b.system]};`;
      lb.textContent=MAP.systems[b.system].name;
      stage.appendChild(lb);
    }else{
      d.className='layerbar';
      d.style.cssText+=`left:${BAND_X}px; top:${b.y}px; width:calc(100% - ${BAND_X+10}px); height:${b.h}px;
        border-color:${COLOR[b.layer]}33; border-left-color:${COLOR[b.layer]};`;
      const lb=document.createElement('div');
      lb.className='layerlabel';
      lb.style.cssText=`left:${BAND_X+8}px; top:${b.y+5}px; color:${COLOR[b.layer]};`;
      lb.textContent=b.label+' ('+b.n+')';
      stage.appendChild(lb);
    }
    stage.appendChild(d);
  });

  // 连线
  drawLinks(svg,nodePos);
  stage.style.height=(y+40)+'px';
  stage.style.width='100%';
  svg.setAttribute('height',(y+40));

  const st=MAP.stats;
  document.getElementById('stat').innerHTML=
    `<span>画布节点 <b>${st.canvas_nodes}</b></span>`+
    `<span>连线 <b>${st.canvas_links}</b></span>`+
    `<span>工程节点 <b>${st.eng_nodes}</b></span>`+
    `<span>标准服务 <b>${st.services}</b></span>`+
    `<span>层带 <b>${st.bands}</b></span>`;
}

function shortName(s){return s.replace(/^L\d\s*/,'').slice(0,26)}

function addNode(stage,n,x,y,w,h,lv){
  const d=document.createElement('div');
  d.className='node'+(n.type==='hardware'?' hw':'')+(n.type==='system'?' sysn':'');
  d.style.cssText=`left:${x}px; top:${y}px; width:${w}px; height:${h}px;
    border-left:3px solid ${COLOR[lv]||'#64748b'};`;
  d.dataset.id=n.id;
  const nm=(n.name||n.id).replace(/^[\u{1F300}-\u{1FAFF}\u2600-\u27BF]\s*/u,'');
  d.innerHTML=`<div class="t">${esc(nm)}</div><div class="s">${esc(n.id)}</div>`;
  d.onclick=()=>openPanel(n);
  stage.appendChild(d);
}

function drawLinks(svg,pos){
  const byId={};
  MAP.nodes.forEach(n=>byId[n.id]=n);
  let s='';
  MAP.links.forEach(l=>{
    const a=pos[l.f], b=pos[l.t];
    if(!a||!b) return;
    const na=byId[l.f]||{}, nb=byId[l.t]||{};
    // 2026-11-26: 画布 241 条连线全画会糊成一片 ⇒ 按"关系远近"分层透明度:
    //   同层 0.30 / 同系统跨层 0.15 / 跨系统 0.06（仍然全画，但视觉有主次）
    let op=0.06, wd=0.9;
    if(na.layer && na.layer===nb.layer){ op=0.30; wd=1.1; }
    else if(na.system && na.system===nb.system){ op=0.15; }
    const ax=a.x+a.w, ay=a.y+a.h/2, bx=b.x, by=b.y+b.h/2;
    let d;
    if(Math.abs(ay-by)<6){ d=`M${ax},${ay} L${bx},${by}`; }
    else{
      const dx=Math.max(28,Math.abs(bx-ax)*0.45);
      d=`M${ax},${ay} C${ax+dx},${ay} ${bx-dx},${by} ${bx},${by}`;
    }
    s+=`<path d="${d}" fill="none" stroke="#22d3ee" stroke-opacity="${op}" stroke-width="${wd}"/>`;
  });
  svg.innerHTML=s;
}

function esc(s){return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}

function openPanel(n){
  const p=document.getElementById('panel'), b=document.getElementById('pbody');
  const svcs=MAP.services.filter(s=>s.layers && s.layers.includes(n.layer));
  const eng=MAP.eng_nodes.find(e=>e.id===n.id);
  b.innerHTML=`
    <h2>${esc(n.icon||'')} ${esc(n.name||n.id)}</h2>
    <div class="meta">
      <span class="chip" style="border-color:${COLOR[n.layer]}; color:${COLOR[n.layer]}">${n.layer||'—'}</span>
      <span class="chip" style="border-color:${COLOR[n.system]}; color:${COLOR[n.system]}">${n.system||'—'} ${(MAP.systems[n.system]||{}).name||''}</span>
      <span class="chip" style="border-color:var(--bord); color:var(--dim)">${esc(n.type)}</span>
    </div>
    <div class="row"><div class="k">节点 id</div><div class="v">${esc(n.id)}</div></div>
    ${n.band?`<div class="row"><div class="k">所属层级带</div><div class="v">${esc(n.band)}</div></div>`:''}
    ${n.desc?`<div class="row"><div class="k">说明</div><div class="v">${esc(n.desc)}</div></div>`:''}
    ${eng?`<div class="row"><div class="k">实现文件</div><div class="v">${esc(eng.impl)}</div></div>
      <div class="row"><div class="k">端口</div><div class="v">in ${eng.in} · out ${eng.out} · ${eng.pure?'纯函数':'有状态'}</div></div>`:''}
    <div class="row"><div class="k">本层标准服务 (${svcs.length})</div>
      <div>${svcs.map(s=>`<span class="chip" style="border-color:${s.port?'#22c55e55':'#64748b55'};color:${s.port?'#22c55e':'#8b9ab0'}">${esc(s.name)} ${s.port?':'+s.port:''}</span>`).join('')||'<span style="color:var(--gray)">无</span>'}</div>
    </div>
    <div class="row"><div class="k">坐标</div><div class="v">x ${Math.round(n.x)} · y ${Math.round(n.y)} · ${Math.round(n.w)}×${Math.round(n.h)}</div></div>
    <div class="row"><div class="k">连线</div><div class="v">
      出 ${MAP.links.filter(l=>l.f===n.id).length} · 入 ${MAP.links.filter(l=>l.t===n.id).length}
    </div></div>`;
  p.classList.add('open');
}

function fit(){
  const wrap=document.getElementById('wrap'), stage=document.getElementById('stage');
  const w=stage.scrollWidth||1500, h=stage.scrollHeight||1000;
  const s=Math.min(1,(wrap.clientWidth-4)/w);
  stage.style.transform=`scale(${s})`;
  wrap.scrollHeight;
}

document.getElementById('btnSvc').onclick=e=>{
  SHOW_SVC=!SHOW_SVC; e.target.classList.toggle('on',SHOW_SVC);
  // 服务为独立底部条, 简单起见这里只做视觉开关(节点不变)
};
document.getElementById('btnHw').onclick=e=>{
  SHOW_HW=!SHOW_HW; e.target.classList.toggle('on',SHOW_HW); render(); fit();
};
document.getElementById('btnFit').onclick=fit;
boot();
</script>
</body>
</html>
