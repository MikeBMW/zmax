<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Z-MAX · 215 点回放 · 停止点标记</title>
<style>
  :root{--bg:#0b0f14;--card:#121a22;--line:#233140;--tx:#dbe7f0;--dim:#8fa6bb;
        --ok:#3ddc84;--warn:#ffb84d;--bad:#ff5f6d;--blue:#4ea3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
  header{position:sticky;top:0;z-index:9;background:#0e151c;border-bottom:1px solid var(--line);
         padding:10px 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.3px}
  .pill{background:#16222c;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim)}
  .pill b{color:var(--tx);font-weight:600}
  .pill.on{border-color:#2c6b4a;background:#12241b;color:#a8e8c4}
  .btns{margin-left:auto;display:flex;gap:8px}
  button{background:#16222c;border:1px solid var(--line);color:var(--tx);border-radius:6px;
         padding:5px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--blue);color:#cfe6ff}
  button.mini{padding:2px 7px;font-size:12px}
  #wrap{padding:8px 12px 60px}
  table{border-collapse:collapse;width:100%}
  th,td{padding:3px 7px;border-bottom:1px solid #17222c;white-space:nowrap;text-align:right}
  th{position:sticky;top:47px;background:#0e151c;color:var(--dim);font-weight:600;font-size:12px;
     border-bottom:1px solid var(--line);z-index:8}
  th.l,td.l{text-align:left}
  tbody tr:hover{background:#131d26}
  tr.cur{background:#16222c;box-shadow:inset 3px 0 0 var(--ok)}
  tr.stp td.stopcell{color:var(--warn)}
  td.i{color:var(--dim)}
  td.j{color:#bcd2e2}
  td.tcp{color:#9fb8cc}
  td input[type=checkbox]{width:16px;height:16px;accent-color:#ffb84d;cursor:pointer}
  td input.nm{width:110px;background:transparent;border:0;border-bottom:1px dashed #2c3d4d;
              color:var(--tx);font:inherit;padding:1px 3px;outline:none;text-align:left}
  td input.nm:focus{border-bottom-color:var(--ok);background:#0b1219}
  .hint{color:var(--dim);font-size:12px;padding:2px 0 8px}
  .sel{background:#1b1408!important}
  .foot{position:fixed;bottom:0;left:0;right:0;background:#0e151c;border-top:1px solid var(--line);
        padding:7px 14px;font-size:12px;color:var(--dim);display:flex;gap:14px}
</style>
</head>
<body>
<header>
  <h1>215 点回放 · 每个点一行</h1>
  <span class="pill">共 <b id="nAll">—</b> 点</span>
  <span class="pill on">已标记停止 <b id="nStop">—</b> 点</span>
  <span class="pill" id="livePill">当前 <b id="liveI">—</b></span>
  <div class="btns">
    <button id="jumpCur">滚到当前点</button>
    <button id="clearAll">清空标记</button>
  </div>
</header>
<div id="wrap">
  <div class="hint">勾选「停」= 到这个点停 1 秒；不勾 = 直接过。名字可不填。勾一下即时保存，跑的时候直接读这份表。</div>
  <table>
    <thead><tr>
      <th class="l">#</th><th>J1</th><th>J2</th><th>J3</th><th>J4</th><th>J5</th><th>J6</th>
      <th>X</th><th>Y</th><th>Z</th><th>t(s)</th><th>停</th><th class="l">名称</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>
<div class="foot"><span>勾选结果存 zmax_data/rokae_sdk/point_stops.json</span><span id="msg"></span></div>
<script>
const API='/api/pts';
let PTS=[], nStop=0, curI=-1;
function fmt(v,d){ return (v==null?'':Number(v).toFixed(d==null?2:d)); }
function setMsg(t){ document.getElementById('msg').textContent=t||''; }
function build(pts){
  const tb=document.getElementById('tb'); const frag=document.createDocumentFragment();
  pts.forEach(p=>{
    const tr=document.createElement('tr'); tr.dataset.i=p.i;
    if(p.stop) tr.classList.add('stp','sel');
    tr.innerHTML=`<td class="l i">#${p.i}</td>` +
      p.j.map(v=>`<td class="j">${fmt(v)}</td>`).join('') +
      p.tcp.map(v=>`<td class="tcp">${fmt(v,1)}</td>`).join('') +
      `<td class="tcp">${fmt(p.t,2)}</td>` +
      `<td class="stopcell"><input type="checkbox" ${p.stop?'checked':''}></td>` +
      `<td class="l"><input class="nm" value="${(p.name||'').replace(/"/g,'&quot;')}" placeholder="（可空）"></td>`;
    tr.querySelector('input[type=checkbox]').addEventListener('change',async e=>{
      const on=e.target.checked;
      tr.classList.toggle('stp',on); tr.classList.toggle('sel',on);
      await post({i:p.i,stop:on});
    });
    const nm=tr.querySelector('input.nm');
    nm.addEventListener('change',async()=>{ await post({i:p.i,name:nm.value}); });
    frag.appendChild(tr);
  });
  tb.replaceChildren(frag);
}
async function post(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(j.ok){ nStop=j.n_stop; document.getElementById('nStop').textContent=nStop;
    setMsg(`#${body.i} ${body.stop===undefined?'名字已存':(body.stop?'→ 停 1 秒':'→ 不停')}  共 ${nStop} 个停点`); }
  else setMsg('保存失败: '+(j.why||''));
}
async function load(){
  const j=await (await fetch(API)).json();
  PTS=j.pts||[]; nStop=j.n_stop||0;
  document.getElementById('nAll').textContent=j.n;
  document.getElementById('nStop').textContent=nStop;
  build(PTS);
}
async function tick(){
  try{
    const j=await (await fetch('/api/se3')).json();
    const i=(j.nearest&&j.nearest.i!=null)?j.nearest.i:-1;
    if(i!==curI){
      const old=document.querySelector('tr.cur'); if(old) old.classList.remove('cur');
      const tr=document.querySelector(`tr[data-i="${i}"]`); if(tr) tr.classList.add('cur');
      curI=i; document.getElementById('liveI').textContent=i;
    }
  }catch(e){}
}
document.getElementById('jumpCur').addEventListener('click',()=>{
  const tr=document.querySelector('tr.cur'); if(tr) tr.scrollIntoView({block:'center',behavior:'smooth'});
});
document.getElementById('clearAll').addEventListener('click',async()=>{
  if(!confirm('清空全部停止标记？')) return;
  for(const p of PTS.filter(x=>x.stop)) await post({i:p.i,stop:false});
  await load(); setMsg('已清空');
});
load().then(()=>{ tick(); setInterval(tick,1000); });
</script>
</body>
</html>
